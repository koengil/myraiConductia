<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23191919'/%3E%3Ctext x='12' y='17' font-size='13' font-weight='700' font-family='Helvetica' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<title>Conductia Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--canvas:#F5F4F1;--surface:#fff;--field:#F1F0EC;--field2:#E9E7E2;--sunken:#EBE9E4;
--line:#ECEAE5;--line2:#E0DED8;--ink:#191919;--ink2:#55534E;--ink3:#6E6E6B;--ink4:#9C9A94;
--ai:#5E5CE6;--ok:#17B26A;--okD:#0B5C3B;--okF:#8FE6BF;--warn:#F5A524;--warnD:#6E5308;--warnF:#FAE6A8;--warnT:#FBF3D9;
--bad:#E5484D;--badD:#8E2440;--badF:#F8C9D1;--sync:#2E90FA;
--ui:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--serif:Georgia,'Times New Roman',serif;--mono:ui-monospace,"SFMono-Regular",monospace;
--e2:0 14px 40px rgb(25 25 25/.09);
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:400 13.5px/20px var(--ui);color:var(--ink);background:var(--canvas);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:#E9E4D6}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:#D6D3CC;border:3px solid transparent;background-clip:content-box;border-radius:8px}*::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid #B9B4A8;outline-offset:1px}
.mono{font-family:var(--mono)}.serif{font-family:var(--serif)}
.app{display:grid;grid-template-rows:56px minmax(0,1fr);height:100dvh}
.top{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--canvas);border-bottom:1px solid var(--line)}
.brandc{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;font:700 13px var(--ui);flex:none}
.dealsw{display:inline-flex;align-items:center;gap:7px;font:500 13px var(--ui);white-space:nowrap}
.dealsw .code{font:500 10px var(--mono);color:var(--ink4)}
.navr{display:inline-flex;gap:2px;min-width:0;overflow:hidden}
.navr button{height:32px;display:inline-flex;align-items:center;padding:0 11px;border-radius:8px;color:var(--ink3);font:500 13px var(--ui);white-space:nowrap;transition:background 120ms}
.navr button:hover{background:var(--field)}
.navr button.on{background:var(--field2);color:var(--ink)}
.navr .ct{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:999px;background:var(--warnF);color:var(--warnD);font:600 10px var(--ui);margin-left:6px;padding:0 4px}
.srch{display:inline-flex;align-items:center;gap:7px;height:32px;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:0 10px;font:400 12px var(--ui);color:var(--ink4);white-space:nowrap;flex:none}
.srch kbd{font:500 9.5px var(--mono);background:var(--field);border-radius:4px;padding:1px 5px;color:var(--ink4)}
.instr{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;flex:none;font:500 12px var(--ui)}
.instr.clear{border:1px solid var(--line2);background:#fff}
.instr .d{width:7px;height:7px;border-radius:999px;background:var(--ok)}
.instr .sub{font:400 11px var(--ui);color:var(--ink4);border-left:1px solid var(--line);padding-left:8px}
.avatar{width:28px;height:28px;border-radius:999px;background:#163561;color:#fff;display:grid;place-items:center;font:600 9.5px var(--ui);flex:none}
.scroll{min-width:0;overflow:auto;scrollbar-gutter:stable}
@keyframes pagein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page{min-height:100%;padding:26px 32px 64px;animation:pagein 200ms ease;max-width:1160px;margin:0 auto}
.ph{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.ph h1{font-size:20px;line-height:26px;letter-spacing:-.015em;margin:0 0 3px;font-weight:600}
.ph p{margin:0;color:var(--ink3);font-size:13px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.btn{height:34px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:0 13px;font-size:12.5px;font-weight:500;white-space:nowrap;transition:background 120ms}
.btn:hover{background:var(--field)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.pri:hover{background:#2f2f2f}
.btn.ghost{border-color:transparent;color:var(--ink3)}.btn.ghost:hover{background:var(--field);color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}
.cardh{min-height:46px;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.cardh h2{font-size:13.5px;margin:0;font-weight:600}
.cardh .meta{margin-left:auto;color:var(--ink4);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px 12px;padding:11px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background 100ms}
.row:last-child{border-bottom:0}
button.row:hover,.row.click:hover{background:#FAF9F6}
.row .grow{flex:1 1 230px;min-width:0}
.row .acts2{display:flex;gap:8px;margin-left:auto;flex:none;align-items:center}
.rt{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rs{display:block;font-size:11.5px;font-weight:400;color:var(--ink4);margin-top:2px}
.m2{font:500 10.5px/15px var(--mono);color:var(--ink4)}
.vc{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:6px;font:500 11.5px var(--ui);white-space:nowrap;max-width:100%}
.vc.ok{background:var(--okF);color:var(--okD)}.vc.warn{background:var(--warnF);color:var(--warnD)}.vc.bad{background:var(--badF);color:var(--badD)}.vc.mut{background:var(--field);color:var(--ink2)}.vc.ai{background:#EDECFB;color:#4a3c99}
.dp{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font:400 11.5px var(--ui);color:var(--ink2);white-space:nowrap}
.dp .d{width:6px;height:6px;border-radius:999px;flex:none}
.sig{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--ui)}
.sig .d{width:7px;height:7px;border-radius:999px}
.pill{height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;font:500 12px var(--ui);color:var(--ink3);transition:background 120ms}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--field2);color:var(--ink)}
.notice{display:flex;gap:9px;padding:10px 12px;border-radius:8px;font:400 12px/1.6 var(--ui);color:var(--ink2)}
.notice.warn{background:var(--warnT)}
.notice.ai{background:#F3F2FC}
.notice b{color:var(--ink)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{height:32px;padding:0 14px;text-align:left;background:#fff;color:var(--ink3);font-size:12px;font-weight:400;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line);white-space:nowrap}
td{height:48px;padding:0 14px;border-bottom:1px solid #F1F0EC;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background 100ms}
tbody tr:hover td{background:#FAF9F6}
tr[data-act]{cursor:pointer}
tr.on td{background:#F5F3EC}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.cite{display:inline-grid;place-items:center;min-width:17px;height:16px;padding:0 4px;border-radius:4px;background:var(--field);color:var(--ink2);font:600 9.5px var(--mono);vertical-align:2px;cursor:pointer;margin-left:1px;transition:background 120ms}
.cite:hover{background:var(--field2)}
.drawer{position:fixed;right:14px;top:70px;bottom:14px;width:380px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--e2);display:grid;grid-template-rows:50px minmax(0,1fr);overflow:hidden;z-index:20;animation:pagein 160ms ease}
.drw-h{display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--line)}
.drw-b{overflow:auto;padding:16px}
.src{border-top:1px solid #F1F0EC;background:#FBFAF6;padding:12px 14px;font:400 12.5px/1.7 var(--serif);color:#2a3440}
.src mark{background:#FFF0A8;border-radius:2px;padding:1px 0}
.kv{display:grid;grid-template-columns:104px 1fr;gap:8px;font-size:12px;padding:7px 0;border-bottom:1px solid #F1F0EC}
.kv span:first-child{color:var(--ink4)}
.overlay{position:fixed;inset:0;background:rgb(25 23 18/.32);display:grid;place-items:start center;padding-top:11vh;z-index:30}
.overlay[hidden]{display:none}
@keyframes din{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dlg{width:min(560px,calc(100vw - 32px));max-height:76dvh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--e2);animation:din 160ms ease}
.dlg-h{display:flex;align-items:center;padding:16px 20px 0}
.dlg-h h2{font-size:16px;margin:0;font-weight:600}
.dlg-b{padding:14px 20px 20px}
.xbtn{width:28px;height:28px;margin-left:auto;display:grid;place-items:center;border-radius:7px;color:var(--ink4)}
.xbtn:hover{background:var(--field);color:var(--ink)}
.fg{margin-bottom:12px}
.fg label{display:block;font:500 12.5px var(--ui);margin-bottom:6px}
.fg input,.fg textarea{width:100%;border:0;border-radius:8px;background:var(--field);padding:9px 12px;font:400 13px var(--ui)}
.fg textarea{min-height:70px;resize:vertical;line-height:1.55}
.fg input:focus,.fg textarea:focus{outline:2px solid #D6D3CC}
.fg .help{font:400 11.5px var(--ui);color:var(--ink4);margin-top:5px}
.toasts{position:fixed;left:50%;top:66px;transform:translateX(-50%);display:grid;gap:8px;z-index:50}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.toast{width:350px;padding:11px 14px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 6px 20px rgb(25 25 25/.1);font:400 12.5px/1.5 var(--ui);animation:tin 150ms ease;display:flex;gap:9px;align-items:flex-start}
.toast .d{width:7px;height:7px;border-radius:999px;margin-top:5px;flex:none}
.toast b{font-weight:600}
.composer{max-width:560px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:var(--e2);padding:16px 16px 14px;text-align:left}
.composer textarea{width:100%;border:0;outline:0;resize:none;min-height:56px;font:400 13.5px/1.5 var(--ui);padding:2px 4px}
.composer textarea::placeholder{color:var(--ink4)}
.cmdrow{width:100%;height:42px;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left;font:400 13px var(--ui);transition:background 100ms}
.cmdrow:hover,.cmdrow:focus{background:var(--field)}
.cmdrow kbd{margin-left:auto;font:500 9.5px var(--mono);background:var(--field);border-radius:4px;padding:1px 5px;color:var(--ink4)}
@media(max-width:1200px){.navr{overflow-x:auto;scrollbar-width:none}.navr::-webkit-scrollbar{display:none}.navr button{padding:0 9px;font-size:12px}.instr .sub{display:none}.srch span.t,.srch kbd{display:none}.dealsw .code{display:none}}
@media(max-width:860px){.top{gap:9px;padding:0 12px}.instr{display:none}.drawer{width:min(380px,calc(100vw - 20px))}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>

  <div style="display:flex;gap:8px;margin-top:18px"><button class="btn pri" data-act="confirm-release">Release and send</button><button class="btn" data-act="close-modal">Cancel</button></div></div></div>`;
 if(k==='skip')return `<div class="dlg" role="dialog"><div class="dlg-h"><h2>Skip station 05</h2>${close}</div>
  <div class="dlg-b"><div class="notice warn"><span>A skip is recorded, attributed, and distinct from completion. Downstream evidence coverage drops.</span></div>
  <div class="fg" style="margin-top:14px"><label>Reason (required)</label><textarea id="skipwhy"></textarea></div>
  <div style="display:flex;gap:8px;margin-top:6px"><button class="btn pri" data-act="confirm-skip">Record governed skip</button><button class="btn" data-act="close-modal">Cancel</button></div></div></div>`;
 if(k==='contract')return `<div class="dlg" role="dialog"><div class="dlg-h"><h2>Step contract — station 05</h2>${close}</div>
  <div class="dlg-b"><div class="kv"><span>Inputs</span><b style="font-size:12px">mandate record · perimeter · counsel notes</b></div>
  <div class="kv"><span>Output</span><b style="font-size:12px">teaser v4 (anonymized)</b></div>
  <div class="kv"><span>Gate</span><b style="font-size:12px">your approval + L1 screen</b></div>
  <div class="kv"><span>Bounds</span><b style="font-size:12px">no external send · code names only · deal-scope retrieval</b></div>
  <div style="display:flex;gap:8px;margin-top:18px"><button class="btn pri" data-act="close-modal">Close</button></div></div></div>`;
 if(k==='compose')return `<div class="dlg" role="dialog"><div class="dlg-h"><h2>New message</h2>${close}</div>
  <div class="dlg-b"><div class="fg"><label>To</label><input value="elena.vasquez@…"></div><div class="fg"><label>Subject</label><input value="Project Summit — process update"></div><div class="fg"><label>Message</label><textarea>The management presentation dry run is confirmed for Thursday 2pm.</textarea><div class="help">Recipient, content, and attachment screening run before Send is enabled.</div></div>
  <div style="display:flex;gap:8px;margin-top:6px"><button class="btn pri" data-act="send-mail">Screen and send</button><button class="btn" data-act="close-modal">Cancel</button></div></div></div>`;
 if(k==='upload')return `<div class="dlg" role="dialog"><div class="dlg-h"><h2>Add to the data room</h2>${close}</div>
  <div class="dlg-b" style="text-align:center;padding:28px 20px 24px">
   ${ic('file',30,'#C9C5BC')}
   <div style="font:400 15px var(--ui);margin-top:8px">Drag and drop your files</div>
   <button class="btn pri" style="margin-top:12px" data-act="do-upload">Upload</button>
   <div style="font:400 12px var(--ui);color:var(--ink4);margin:14px 0 10px">Or choose from</div>
   <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <span class="dp" style="cursor:pointer"><span class="d" style="background:#2E5BFF"></span>Deal Folder</span>
    <span class="dp" style="cursor:pointer"><span class="d" style="background:#17B26A"></span>SharePoint</span>
    <span class="dp" style="cursor:pointer"><span class="d" style="background:#F5A524"></span>Google Drive</span>
   </div>
   <div style="font:400 11px var(--ui);color:var(--ink4);margin-top:14px">Classification is assigned on upload · every add writes to the register</div>
  </div></div>`;
 if(k==='invite')return `<div class="dlg" role="dialog"><div class="dlg-h"><h2>Invite to the deal perimeter</h2>${close}</div>
  <div class="dlg-b"><div class="fg"><label>Work email</label><input value="advisor@outside.example"></div>
  <div class="fg"><label>Boundary</label><input value="Buyer room · Phase II · NDA required" readonly></div>
  <div class="notice warn"><span>External participants see only explicitly released content in their assigned room. The invitation and every later view are logged.</span></div>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn pri" data-act="confirm-invite">Send invitation</button><button class="btn" data-act="close-modal">Cancel</button></div></div></div>`;
 return '';}
/* ---------- render + actions ---------- */
const VIEWS={home:vHome,today:vToday,rail:vRail,ask:vAsk,buyers:vBuyers,mail:vMail,room:vRoom,team:vTeam,audit:vAudit};
function render(){
 const app=$('#app');
 if(!S.signedIn){app.innerHTML=vAuth()}
 else{app.innerHTML=shell((VIEWS[UI.route]||vHome)())+(UI.cite?drawer():'')}
 const ov=$('#overlay');ov.hidden=!UI.modal;ov.innerHTML=UI.modal?modal():'';
 if(UI.modal){setTimeout(()=>ov.querySelector('input,textarea,button')?.focus(),0)}
}
let agentTimer=null;
function runStep(){
 UI.modal=null;UI.route='rail';UI.station=5;UI.agent={stage:0,done:false};
 audit('Step','#17B26A','Casey run started — station 05 (Draft teaser) · attempt 1','run #2208');
 render();toast('<b>Casey run started.</b> 4 bounded stages; your approval is the gate.');
 let i=0;agentTimer=setInterval(()=>{i++;
  if(!UI.agent){clearInterval(agentTimer);return}
  if(i>=4){clearInterval(agentTimer);UI.agent={stage:4,done:true};audit('Step','#17B26A','Casey output ready — teaser v4 screened clear · your approval is the gate','run #2208');toast('<b>Teaser v4 is ready.</b> Screened clear; review 4 changes.');render();return}
  UI.agent={stage:i,done:false};render()},900)}
function handle(act,el){
 const id=el?.dataset?.id,to=el?.dataset?.to;
 switch(act){
  case'signin':UI.mfa=true;render();break;
  case'mfa':S.signedIn=true;save();audit('Platform','#2E90FA','Session started · J. Morrison (MD) · MFA verified','device trusted');render();toast('<b>Signed in.</b> Perimeter active; session is recorded.');break;
  case'go':UI.route=to;UI.modal=null;UI.cite=null;render();break;
  case'close-modal':UI.modal=null;render();break;
  case'close-drawer':UI.cite=null;render();break;
  case'modal':UI.modal=id;render();break;
  case'deal-locked':UI.modal=null;render();toast('Prototype: Harbor is stubbed — deal identity is URL state.','warn');break;
  case'cite':UI.cite=id||'1';UI.modal=null;audit('File','#F5A524','Evidence opened — source ['+UI.cite+'] · view logged','entitled: deal team');render();break;
  case'station':UI.station=+id;render();break;
  case'run-step':runStep();break;
  case'stop-run':UI.agent=null;audit('Step','#17B26A','Casey run stopped by MD — partial work preserved','run #2208');render();toast('<b>Run stopped.</b> Partial work preserved.','warn');break;
  case'confirm-approve':{const r=$('#rationale');if(r&&!r.value.trim()){toast('Decision rationale is required.','bad');r.focus();return}
   const st=S.stations.find(x=>x.id===5);st.st='done';st.receipt={v:'clear',line:'screened clear · 6s',checks:'approved v5 by MD · rationale recorded'};
   const nx=S.stations.find(x=>x.id===6);nx.st='active';nx.desc='Casey builds the buyer long list from the acquirer graph, scored by fit model v3. The compliance verdict gates the result.';
   const d2=S.decisions.find(x=>x.id==='d2');if(d2)d2.done=true;
   UI.agent=null;UI.modal=null;UI.station=6;
   audit('Step','#17B26A','Teaser APPROVED v5 by MD · rationale recorded · station 06 unlocked','before/after kept');save();render();toast('<b>Approved v5.</b> Station 06 unlocked; receipt in the register.');break}
  case'confirm-skip':{const w=$('#skipwhy');if(!w?.value.trim()){toast('A skip reason is required.','bad');w?.focus();return}
   const st=S.stations.find(x=>x.id===UI.station);st.st='skip';st.skipBy='J. Morrison';UI.modal=null;
   audit('Step','#17B26A','Governed skip recorded — station '+String(UI.station).padStart(2,'0')+' · reason captured','distinct from completion');save();render();toast('<b>Skip recorded</b> with receipt.');break}
  case'retry-kyc':{const st=S.stations.find(x=>x.id===3);st.st='done';st.receipt={v:'clear',line:'screened clear · 9s',checks:'all beneficial owners verified · entity current'};
   audit('Step','#17B26A','KYC retry — 1 owner re-verified · hold cleared','scoped retry');save();render();toast('<b>KYC hold cleared.</b> Receipt updated.');break}
  case'escalate':audit('Platform','#2E90FA','Escalated to compliance — KYC hold, station 03','CCO queue');save();render();toast('<b>Escalated.</b> Compliance notified with your note.');break;
  case'decide':{const d=S.decisions.find(x=>x.id===id);if(!d)break;
   if(d.goto){UI.route='mail';UI.mailF='held';UI.mailSel='h1';render();break}
   if(d.id==='d2'){UI.route='rail';UI.station=5;UI.agent={stage:4,done:true};render();break}
   d.done=true;audit('Mail','#2E90FA','Buyer outreach wave 1 APPROVED by MD · 6 sends queued behind screening','station 10');save();render();toast('<b>Approved.</b> 6 sends queued behind screening.');break}
  case'mailf':UI.mailF=id;UI.mailSel=(S.mail.find(m=>m.f===id)||{}).id;render();break;
  case'mailsel':UI.mailSel=id;render();break;
  case'confirm-release':{const r=$('#rationale');if(r&&!r.value.trim()){toast('Override rationale is required.','bad');r.focus();return}
   const m=S.mail.find(x=>x.id===UI.mailSel);if(m){m.released=true}UI.modal=null;
   const d3=S.decisions.find(x=>x.id==='d3');if(d3)d3.done=true;
   audit('Mail','#2E90FA','Process letter RELEASED by MD · L1 override · rationale attached','lexicon v12 · snapshot kept');save();render();toast('<b>Released and sent.</b> Override recorded in the register.');break}
  case'reject-mail':{const m=S.mail.find(x=>x.id===UI.mailSel);if(m){m.f='drafts';m.meta='returned with note'}
   audit('Mail','#2E90FA','Held message REJECTED with note — returned to drafts','no send occurred');save();UI.mailSel=null;render();toast('<b>Rejected.</b> Returned to drafts with your note.','warn');break}
  case'edit-resend':toast('Prototype: opens the editor with the flagged phrase selected.','warn');break;
  case'send-mail':UI.modal=null;audit('Mail','#2E90FA','Message screened CLEAR and sent — process update to client','9s · logged');save();render();toast('<b>Screened clear</b> and sent.');break;
  case'doc':UI.docSel=id;render();break;
  case'doc-open':audit('File','#F5A524','Document opened — '+(S.docs.find(x=>x.id===UI.docSel)||{}).name,'view logged');save();render();toast('<b>Preview opened.</b> View logged.');break;
  case'doc-dl':audit('File','#F5A524','Document DOWNLOADED — '+(S.docs.find(x=>x.id===UI.docSel)||{}).name,'sha kept');save();render();toast('<b>Download logged</b> to the register.');break;
  case'do-upload':UI.modal=null;audit('File','#F5A524','Document uploaded to 05. Data room · classification assigned','sha computed');save();render();toast('<b>Uploaded.</b> Classification assigned; write logged.');break;
  case'confirm-invite':UI.modal=null;audit('Platform','#2E90FA','External invitation sent — buyer room, Phase II, NDA required','boundary enforced');save();render();toast('<b>Invitation sent.</b> Boundary: buyer room, Phase II.');break;
  case'buyer':UI.buyer=id;render();break;
  case'approve-buyer':{const b=S.buyers.find(x=>x.id===id);b.approved=true;
   audit('Step','#17B26A','Outreach draft APPROVED — '+b.name+' · queued behind screening','fit '+b.fit);save();render();toast('<b>'+b.name+' approved.</b> Queued behind screening.');break}
  case'approve-drafts':{let n=0;S.buyers.forEach(b=>{if(b.ds==='In review'&&!b.approved){b.approved=true;n++}});
   if(n){audit('Step','#17B26A',n+' outreach drafts APPROVED in bulk · queued behind screening','run #2207');save();render();toast('<b>'+n+' drafts approved.</b> Queued behind screening.')}else toast('Nothing in review to approve.','warn');break}
  case'rerun':toast('<b>Column re-run queued.</b> Prior values kept in history.','warn');break;
  case'suggest':{const t=$('#ask-in');if(t){t.value=el.dataset.q;t.focus()}break}
  case'ask-send':{const t=$('#ask-in');if(!t?.value.trim()){toast('Type a question first.','warn');t?.focus();return}
   audit('Chat','#2E90FA','Ask: "'+t.value.trim().slice(0,60)+'" · screened · queued','deal scope');save();
   if(UI.route==='home'){S.history.unshift({icon:'quote',t:t.value.trim().slice(0,80),when:'just now'});save();UI.route='ask';render()}else{t.value=''}
   toast('<b>Screened and queued.</b> Casey is reading the deal room.');break}
  case'auditf':UI.auditF=id;render();break;
  case'export-audit':UI.modal=null;audit('Platform','#2E90FA','Decision package EXPORTED by MD — full reconstruction','SEC 17a-4');save();render();toast('<b>Decision package exported.</b> The export itself is logged.');break;
 }}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){e.preventDefault();handle(el.dataset.act,el)}});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();UI.modal=UI.modal==='cmd'?null:'cmd';render()}
 if(e.key==='Escape'){if(UI.modal){UI.modal=null;render()}else if(UI.cite){UI.cite=null;render()}}
});
render();
})();
</script>
</body>
</html>
