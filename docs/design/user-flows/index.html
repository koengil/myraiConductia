<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conductia User Flows</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed pan-and-zoom canvas between a refinements rail (left) and a detail drawer (right).
   Diagram grammar follows context/flow-notation.md §2, §3 and §6; chrome follows the Workbench register. */
:root {
  --font-ui: Inter, "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* chrome (Workbench warm neutrals) */
  --bg: #f5f4f1; --surface: #ffffff; --surface-2: #f1f0ec; --ink: #191919; --ink-2: #55534e; --ink-3: #6e6e6b;
  --stroke: #e0ded8; --focus: #1fa3c4; --shadow: 0 14px 40px rgb(25 25 25 / 0.12);
  /* diagram (notation spec §6) */
  --canvas: #ffffff; --band-alt: #f7f8fa; --subflow-bg: #edeef1; --rule: #c9ccd2; --band-label: #6f747d; --title-bg: #e4e5e8;
  --terminal: #111418; --terminal-ink: #7fe3f7; --terminal-stroke: #111418;
  --page: #2e333a; --page-ink: #ffffff;
  --user: #5dd5f2; --user-shadow: #1fa3c4; --user-ink: #0b2530;
  --system: #ffffff; --node-stroke: #8c9199; --node-ink: #1f2329;
  --data: #f1f2f4; --subref: #ffffff; --subref-stroke: #4a4f57;
  --note: #ffffff; --doclink: #9b51e0;
  --flow: #2bb3d9; --hub: #1fa3c4; --backnav: #e0413a; --anchor: #e0413a; --ref: #a9aeb7;
  --chip: #ffffff; --flag-bg: #fff4d6; --flag-ink: #6e5308; --flag-stroke: #d9a521;
  --hit: #f2a900;
  /* refinement status */
  --st-planned: #c98a00; --st-preview: #2f80ed; --st-handoff: #d23a33; --st-question: #7a5af8; --st-done: #2e9e5b; --st-keep: #5f6b7a;
  --badge-ink: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #1b1e22; --surface-2: #23272c; --ink: #eceae5; --ink-2: #b8b5ae; --ink-3: #94918a;
    --stroke: #33373d; --focus: #5dd5f2; --shadow: 0 14px 40px rgb(0 0 0 / 0.45);
    --canvas: #15181c; --band-alt: #191c21; --subflow-bg: #1f2329; --rule: #3a4048; --band-label: #9aa0a8; --title-bg: #22262c;
    --terminal: #050607; --terminal-ink: #7fe3f7; --terminal-stroke: #3a7f8f;
    --page: #d9dde3; --page-ink: #111418;
    --user: #4cc9e8; --user-shadow: #167f99; --user-ink: #071a22;
    --system: #20252b; --node-stroke: #78808a; --node-ink: #e6e9ee;
    --data: #262b32; --subref: #20252b; --subref-stroke: #aab1bb;
    --note: #1b1e22; --doclink: #b98af0;
    --flow: #3cc1e6; --hub: #3cc1e6; --backnav: #ff6b62; --anchor: #ff6b62; --ref: #6c737d;
    --chip: #20252b; --flag-bg: #3a3016; --flag-ink: #f5d27a; --flag-stroke: #a57d1c;
    --hit: #ffc533;
    --st-planned: #d99a0b; --st-preview: #4a94f5; --st-handoff: #e5544d; --st-question: #8f74fa; --st-done: #39b06c; --st-keep: #7d8896;
    --badge-ink: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1b1e22; --surface-2: #23272c; --ink: #eceae5; --ink-2: #b8b5ae; --ink-3: #94918a;
  --stroke: #33373d; --focus: #5dd5f2; --shadow: 0 14px 40px rgb(0 0 0 / 0.45);
  --canvas: #15181c; --band-alt: #191c21; --subflow-bg: #1f2329; --rule: #3a4048; --band-label: #9aa0a8; --title-bg: #22262c;
  --terminal: #050607; --terminal-ink: #7fe3f7; --terminal-stroke: #3a7f8f;
  --page: #d9dde3; --page-ink: #111418;
  --user: #4cc9e8; --user-shadow: #167f99; --user-ink: #071a22;
  --system: #20252b; --node-stroke: #78808a; --node-ink: #e6e9ee;
  --data: #262b32; --subref: #20252b; --subref-stroke: #aab1bb;
  --note: #1b1e22; --doclink: #b98af0;
  --flow: #3cc1e6; --hub: #3cc1e6; --backnav: #ff6b62; --anchor: #ff6b62; --ref: #6c737d;
  --chip: #20252b; --flag-bg: #3a3016; --flag-ink: #f5d27a; --flag-stroke: #a57d1c;
  --hit: #ffc533;
  --st-planned: #d99a0b; --st-preview: #4a94f5; --st-handoff: #e5544d; --st-question: #8f74fa; --st-done: #39b06c; --st-keep: #7d8896;
  --badge-ink: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12px; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--stroke); position: relative; z-index: 5;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-weight: 700; letter-spacing: -0.01em; font-size: 15px; }
.brand span { color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.grow { flex: 1 1 auto; }
.ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--stroke); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.icon { padding: 5px 9px; min-width: 32px; justify-content: center; }
.search { position: relative; }
.search input {
  width: 240px; max-width: 46vw; border: 1px solid var(--stroke); background: var(--surface-2); border-radius: 8px; padding: 5px 64px 5px 10px;
}
.search .count { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--ink-3); pointer-events: none; }
select.btn { padding-right: 6px; max-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.counter { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-2); }
.counter .lbl { margin-right: 2px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 12px; line-height: 18px;
  border: 1px solid var(--stroke); background: var(--surface); white-space: nowrap;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
button.pill[aria-pressed="false"] { opacity: 0.45; text-decoration: line-through; }
.st-planned { color: var(--st-planned); } .st-preview { color: var(--st-preview); } .st-handoff { color: var(--st-handoff); }
.st-question { color: var(--st-question); } .st-done { color: var(--st-done); } .st-keep { color: var(--st-keep); }
.pill > .t { color: var(--ink); }

.main { position: relative; min-height: 0; display: grid; grid-template-columns: auto 1fr; }
.refpanel {
  grid-column: 1; grid-row: 1;
  width: 360px; background: var(--surface); border-right: 1px solid var(--stroke); display: grid; grid-template-rows: auto auto 1fr; min-height: 0;
}
.refpanel[hidden] { display: none !important; }
.refpanel header { padding: 12px 16px 8px; border-bottom: 1px solid var(--stroke); }
.refpanel h2 { font-size: 14px; margin: 0 0 4px; }
.refpanel p { margin: 0; color: var(--ink-3); font-size: 12px; }
.reffilters { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--stroke); }
.reffilters select, .reffilters input { border: 1px solid var(--stroke); border-radius: 8px; background: var(--surface-2); padding: 4px 8px; font-size: 13px; min-width: 0; }
.reffilters input { flex: 1 1 120px; }
.reflist { overflow: auto; padding: 4px 0 24px; min-height: 0; }
.refrow { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 9px 16px; border-bottom: 1px solid var(--stroke); cursor: pointer; }
.refrow:hover, .refrow.sel { background: var(--surface-2); }
.refrow .num { grid-row: span 3; align-self: start; }
.refrow .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.refrow .rid { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.refrow .ttl { font-size: 13px; min-width: 0; }
.refrow .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.nb { display: inline-grid; place-items: center; min-width: 26px; height: 20px; padding: 0 6px; border-radius: 10px; font: 700 12px/1 var(--font-ui); background: var(--st-keep); }
.nb > span { color: var(--badge-ink); }
.nb.st-planned { background: var(--st-planned); } .nb.st-preview { background: var(--st-preview); } .nb.st-handoff { background: var(--st-handoff); }
.nb.st-question { background: var(--st-question); } .nb.st-done { background: var(--st-done); } .nb.st-keep { background: var(--st-keep); }
.chip {
  font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--stroke); background: var(--surface); border-radius: 6px; padding: 0 6px; line-height: 20px;
}
.chip:hover { border-color: var(--focus); }
.chip.off { font-family: var(--font-ui); color: var(--ink-3); cursor: default; }

.viewport { grid-column: 2; grid-row: 1; position: relative; overflow: hidden; background: var(--canvas); touch-action: none; min-width: 0; }
.viewport svg#map { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; -webkit-user-select: none; }
.viewport.dragging svg#map { cursor: grabbing; }
.bandstrip {
  position: absolute; left: 12px; top: 10px; z-index: 3; pointer-events: none;
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--band-label);
  background: color-mix(in srgb, var(--canvas) 88%, transparent); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--stroke);
}
.legend {
  position: absolute; right: 12px; top: 10px; z-index: 3; width: 290px; max-height: calc(100% - 200px); overflow: auto;
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 12px; box-shadow: var(--shadow); font-size: 12px;
}
.legend summary { padding: 8px 12px; font-weight: 600; font-size: 13px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.legend summary::-webkit-details-marker { display: none; }
.legend summary::after { content: "Hide"; font-weight: 400; color: var(--ink-3); }
.legend:not([open]) summary::after { content: "Show"; }
.legend .lg { display: grid; grid-template-columns: 56px 1fr; gap: 6px 10px; align-items: center; padding: 0 12px 10px; }
.legend .lg svg { width: 56px; height: 30px; overflow: visible; }
.legend h3 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 6px 12px 6px; font-weight: 600; }
.legend label { display: flex; gap: 8px; align-items: center; padding: 2px 12px; }
.legend .layers { padding-bottom: 10px; }
.minimap {
  position: absolute; right: 12px; bottom: 12px; z-index: 3; width: 200px; height: 150px;
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; cursor: crosshair;
}
.minimap svg { width: 100%; height: 100%; display: block; }
.zoomctl { position: absolute; left: 12px; bottom: 12px; z-index: 3; display: flex; gap: 6px; flex-wrap: wrap; }
.zoomctl .btn { box-shadow: var(--shadow); }
.zoomctl .pct { font-variant-numeric: tabular-nums; min-width: 52px; justify-content: center; }

.drawer {
  position: absolute; right: 0; top: 0; bottom: 0; width: 400px; max-width: 100%; z-index: 6;
  background: var(--surface); border-left: 1px solid var(--stroke); box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr;
}
.drawer header { display: flex; align-items: start; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--stroke); }
.drawer header .k { flex: 1; min-width: 0; }
.drawer .eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.drawer h2 { margin: 4px 0 0; font-size: 16px; line-height: 1.35; text-wrap: balance; overflow-wrap: anywhere; }
.drawer .body { overflow: auto; padding: 4px 16px 24px; }
.drawer section { padding: 10px 0; border-bottom: 1px solid var(--stroke); }
.drawer section:last-child { border-bottom: 0; }
.drawer h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.drawer p { margin: 0 0 6px; overflow-wrap: anywhere; }
.drawer .q { color: var(--ink-2); font-style: italic; }
.drawer ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.drawer li button, .linkbtn {
  border: 0; background: none; padding: 2px 0; text-align: left; color: var(--ink); display: flex; gap: 8px; align-items: baseline; width: 100%;
}
.drawer li button:hover .lt, .linkbtn:hover { text-decoration: underline; }
.drawer li .mono { flex: none; color: var(--ink-3); }
.drawer li .lt { min-width: 0; overflow-wrap: anywhere; }
.drawer .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.flagtag { font-family: var(--font-mono); font-size: 12px; background: var(--flag-bg); color: var(--flag-ink); border: 1px solid var(--flag-stroke); border-radius: 6px; padding: 0 6px; }
.typechip { font-family: var(--font-ui); font-size: 12px; border-radius: 6px; padding: 0 6px; border: 1px solid var(--stroke); color: var(--ink-2); }

/* ---------- diagram ---------- */
svg text { font-family: var(--font-ui); }
.band-bg { fill: var(--canvas); }
.band-bg.alt { fill: var(--band-alt); }
.band-bg.sub { fill: var(--subflow-bg); }
.band-rule { stroke: var(--rule); stroke-width: 1; }
.band-label { fill: var(--band-label); font-size: 12px; letter-spacing: 0.08em; cursor: pointer; }
.band-label:hover { fill: var(--ink); }
.band-persona { fill: var(--band-label); font-size: 12px; }
.bandov { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.bo {
  position: absolute; pointer-events: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; line-height: 18px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--stroke); border-radius: 6px; padding: 1px 8px; white-space: nowrap; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
  max-width: calc(100% - 12px); overflow: hidden;
}
.bo > span:nth-of-type(1) { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bo > * { flex: none; } .bo > span:nth-of-type(1) { flex: 0 1 auto; }
.bo:hover { border-color: var(--focus); }
.bo b { font-family: var(--font-mono); font-weight: 600; }
.bo .sd { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.bo .sd .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.bo .n { color: var(--ink-2); }
.far .ntext, .far .tags, .far .elabel, .far .band-persona { display: none; }
.title-bg { fill: var(--title-bg); }
.title-mark { fill: none; stroke: var(--ink); stroke-width: 2.5; }
.title-markt { fill: var(--ink); font-size: 30px; font-weight: 800; letter-spacing: 0.02em; }
.title-big { fill: var(--band-label); font-size: 26px; font-weight: 300; letter-spacing: 0.04em; }
.title-sm { fill: var(--ink-2); font-size: 14px; }
.title-xs { fill: var(--band-label); font-size: 12px; }
.title-tag rect { fill: var(--ink); } .title-tag text { fill: var(--surface); font-size: 12px; font-weight: 600; }

.edge { fill: none; stroke-width: 1.5; }
.edge.flow { stroke: var(--flow); marker-end: url(#m-flow); }
.edge.backnav { stroke: var(--backnav); stroke-dasharray: 4 3; marker-end: url(#m-back); }
.edge.ref { stroke: var(--ref); stroke-width: 1.2; stroke-dasharray: 2 3; marker-end: url(#m-ref); }
.m-flow { fill: var(--flow); } .m-back { fill: var(--backnav); } .m-ref { fill: var(--ref); }
.elabel rect { fill: var(--chip); stroke: var(--node-stroke); stroke-width: 1; }
.elabel text { fill: var(--node-ink); font-size: 12px; }
.hide-backnav .edge.backnav, .hide-ref .edge.ref, .hide-notes .t-note, .hide-notes .edge.ref, .hide-badges .badges, .hide-flags .tags { display: none; }

.node { cursor: pointer; outline: none; }
.node .ntext { font-size: 12px; fill: var(--node-ink); pointer-events: none; }
.node .route { font-family: var(--font-mono); font-size: 12px; fill: var(--ink-2); }
.node .ring { fill: none; stroke: var(--focus); stroke-width: 3; opacity: 0; }
.node:focus-visible .ring, .node.sel .ring { opacity: 1; }
.node.hit .ring { opacity: 1; stroke: var(--hit); }
.node.pulse .ring { animation: pulse 1.4s ease-out 2; }
@keyframes pulse { 0% { opacity: 1; stroke-width: 3; } 70% { opacity: 0.2; stroke-width: 10; } 100% { opacity: 0; stroke-width: 3; } }
@media (prefers-reduced-motion: reduce) { .node.pulse .ring { animation: none; opacity: 1; } }
.t-term .shape { fill: var(--terminal); stroke: var(--terminal-stroke); } .t-term .ntext { fill: var(--terminal-ink); }
.t-page .shape { fill: var(--page); } .t-page .ntext { fill: var(--page-ink); }
.t-action .shadow { fill: var(--user-shadow); } .t-action .shape { fill: var(--user); } .t-action .ntext { fill: var(--user-ink); }
.t-system .shape { fill: var(--system); stroke: var(--node-stroke); filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / 0.18)); }
.t-decision .shape { fill: var(--system); stroke: var(--node-stroke); }
.t-data .shape { fill: var(--data); stroke: var(--node-stroke); }
.t-sub .shape { fill: var(--subref); stroke: var(--subref-stroke); } .t-sub .bar { stroke: var(--subref-stroke); }
.t-sub .ntext { font-weight: 600; letter-spacing: 0.03em; }
.t-note .shape { fill: var(--note); stroke: var(--node-stroke); stroke-dasharray: 5 3; }
.t-doc .shape { fill: var(--note); stroke: var(--doclink); stroke-dasharray: 5 3; }
.ntext .b { font-weight: 700; }
.t-hub .shape { fill: var(--hub); } .t-hub .ltr { fill: #ffffff; }
.t-ret .shape { fill: var(--canvas); stroke: var(--hub); stroke-width: 1.6; } .t-ret .ltr { fill: var(--hub); }
.t-anchor .shape { fill: var(--anchor); } .t-anchor .ltr { fill: #ffffff; }
.t-jump .shape { fill: var(--canvas); stroke: var(--anchor); stroke-width: 1.6; } .t-jump .ltr { fill: var(--anchor); }
.ltr { font-size: 12px; font-weight: 700; text-anchor: middle; pointer-events: none; }
.tags rect { fill: var(--flag-bg); stroke: var(--flag-stroke); }
.tags text { fill: var(--flag-ink); font-family: var(--font-mono); font-size: 12px; }
.tags path { fill: var(--flag-ink); }
.focus-mode .node:not(.hl), .focus-mode .edge:not(.hl), .focus-mode .elabel:not(.hl) { opacity: 0.2; }
.edge.hl { stroke-width: 2.4; }
.badge { cursor: pointer; }
.badge rect { stroke: var(--canvas); stroke-width: 1.5; }
.badge text { fill: var(--badge-ink); font-size: 12px; font-weight: 700; text-anchor: middle; pointer-events: none; }
.badge line { stroke-width: 1.5; }
.badge.more rect { fill: var(--surface); stroke: var(--node-stroke); }
.badge.more text { fill: var(--ink); }
.fill-planned { fill: var(--st-planned); stroke: var(--st-planned); } .fill-preview { fill: var(--st-preview); stroke: var(--st-preview); }
.fill-handoff { fill: var(--st-handoff); stroke: var(--st-handoff); } .fill-question { fill: var(--st-question); stroke: var(--st-question); }
.fill-done { fill: var(--st-done); stroke: var(--st-done); } .fill-keep { fill: var(--st-keep); stroke: var(--st-keep); }
.badge rect.fill-planned, .badge rect.fill-preview, .badge rect.fill-handoff, .badge rect.fill-question, .badge rect.fill-done, .badge rect.fill-keep { stroke: var(--canvas); }

#print { display: none; }

/* ---------- narrow screens ---------- */
@media (max-width: 900px) {
  .refpanel { position: absolute; left: 0; top: 0; bottom: 0; z-index: 7; width: min(360px, 92vw); box-shadow: var(--shadow); }
  .drawer { top: auto; height: 62%; width: 100%; border-left: 0; border-top: 1px solid var(--stroke); border-radius: 12px 12px 0 0; }
  .legend { width: min(290px, calc(100% - 24px)); top: 46px; }
  .minimap { width: 140px; height: 104px; }
  .counter .lbl { display: none; }
}
@media (max-width: 560px) {
  .brand span { display: none; }
  .search input { width: 150px; }
  .minimap { display: none; }
  select.btn { max-width: 140px; }

/* ---------- print: one band per page, legend on each ---------- */

  let b = `<section><div class="tags"><span class="pill st-${r.status}"><span class="dot"></span><span class="t">${STATUS_NAME[r.status]}</span></span><span class="typechip">${esc(r.area)}</span>${r.task ? `<span class="typechip">Task ${esc(r.task)}</span>` : ''}</div></section>`;

  if (r.change) b += `<section><h3>Change</h3><p>${esc(r.change)}</p></section>`;
  if (r.check) b += `<section><h3>${r.area === 'Keep' ? 'Check it still works' : 'Done when'}</h3><p>${esc(r.check)}</p></section>`;
  if (r.questions && r.questions.length) b += `<section><h3>Open question</h3>${r.questions.map((q) => `<p><span class="mono">${esc(q.id)}</span> ${esc(q.question)} <span class="q">(${esc(q.owner)})</span></p>`).join('')}</section>`;
  if (r.whatChanged) b += `<section><h3>What changed</h3><p>${esc(r.whatChanged)}</p></section>`;
  if (r.surface) b += `<section><h3>Where in the code</h3><p class="mono">${esc(r.surface)}</p></section>`;
  b += `<section><h3>On the map</h3>${r.nodeIds.length ? `<ul>${r.nodeIds.map((id) => nodeLink(nodeById.get(id))).join('')}</ul>` : `<p class="q">Not on the map: ${esc(r.offMap)}.</p>`}</section>`;
  openDrawer(`<span class="nb st-${r.status}"><span>${r.n}</span></span><span>${esc(r.id)}</span>`, r.title, b);
  if (r.nodeIds.length) { const n = nodeById.get(r.nodeIds[0]); centerOn(n.gx, n.gy, Math.max(C.k, 0.9)); r.nodeIds.forEach(pulse); }
}
function openBand(gid, fit = true) {
  const g = groups.find((x) => x.id === gid); if (!g) return;
  setHash(gid);
  const real = g.nodes.filter((n) => !CONNECTOR.has(n.type));
  const touched = new Set(); real.forEach((n) => (refsByNode.get(n.id) || []).forEach((r) => touched.add(r)));
  let b = '';
  if (g.persona) b += `<section><h3>Who</h3><p>${esc(g.persona)}</p></section>`;
  if (g.entry) b += `<section><h3>Entry</h3><p>${esc(g.entry)}</p><h3>Exit</h3><p>${esc(g.exit)}</p></section>`;
  if (g.from) b += `<section><h3>Drawn from</h3><p>${esc(g.from)}</p></section>`;
  if (g.flags && g.flags.length) b += `<section><h3>Feature flags</h3><div class="tags">${g.flags.map((f) => `<span class="flagtag">${esc(f)}</span>`).join('')}</div></section>`;
  if (g.links) b += `<section><h3>Links to other journeys</h3><p>${esc(g.links)}</p></section>`;
  if (g.specs && g.specs.length) b += `<section><h3>End-to-end specs</h3>${g.specs.map((s) => `<p class="mono">${esc(s)}</p>`).join('')}</section>`;
  b += `<section><h3>On this band</h3><p>${real.length} nodes, ${touched.size} refinements.</p><p class="q">Link to this band: #${esc(g.id)}</p></section>`;
  if (touched.size) b += `<section><h3>Refinements</h3><ul>${[...touched].sort((a, c) => a.n - c.n).map(refLink).join('')}</ul></section>`;
  openDrawer(`<span>${esc(g.id)}</span><span class="typechip">${g.kind === 'journey' ? 'Journey' : g.kind === 'subflow' ? 'Sub-flow' : 'Notes'}</span>`, g.title, b);
  if (fit) fitRect(bandBox(g), true, 12);
}
$('#drBody').addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]'), rf = ev.target.closest('[data-ref]'), bd = ev.target.closest('[data-band]');
  if (go) goNode(go.dataset.go); else if (rf) openRef(rf.dataset.ref); else if (bd) openBand(bd.dataset.band);
});

// map clicks and keys
function activate(el) {
  if (el.classList.contains('badge')) {
    if (el.dataset.ref) openRef(el.dataset.ref); else openNode(el.dataset.node);
    return;
  }
  if (el.classList.contains('band-label')) { openBand(el.dataset.band); return; }
  const id = el.dataset.id, n = nodeById.get(id);
  if (n.type === 'ret' || n.type === 'jump') { const p = partnersOf(n)[0]; goNode(p.id); return; }
  if (n.type === 'anchor') { openNode(id); const ps = partnersOf(n); if (ps.length) { centerOn(ps[0].gx, ps[0].gy); ps.forEach((p) => pulse(p.id)); } return; }
  if (n.type === 'hub') { openNode(id); partnersOf(n).forEach((p) => pulse(p.id)); return; }
  openNode(id);
}
world.addEventListener('click', (ev) => {
  if (moved > 4) return;
  const el = ev.target.closest('.badge, .band-label, .node');
  if (el) activate(el); else if (!drawer.hidden) closeDrawer();
});
world.addEventListener('keydown', (ev) => {
  const el = ev.target.closest('.node, .band-label'); if (!el) return;
  if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); activate(el); }
});
world.addEventListener('focusin', (ev) => {
  const el = ev.target.closest('.node'); if (!el) return;
  const n = nodeById.get(el.dataset.id);
  const sx = n.gx * C.k + C.x, sy = n.gy * C.k + C.y;
  if (sx < 40 || sy < 40 || sx > vp.clientWidth - 40 || sy > vp.clientHeight - 40 || C.k < 0.5) centerOn(n.gx, n.gy, Math.max(C.k, 0.9), false);
});
window.addEventListener('keydown', (ev) => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (ev.key === 'Escape') { if (typing) document.activeElement.blur(); else if (!drawer.hidden) closeDrawer(); return; }
  if (typing) return;
  if (ev.key === '+' || ev.key === '=') { zoomAt(1.25); ev.preventDefault(); }
  else if (ev.key === '-' || ev.key === '_') { zoomAt(0.8); ev.preventDefault(); }
  else if (ev.key === '0') { fitRect(WORLD); ev.preventDefault(); }
  else if (ev.key === '/') { $('#q').focus(); ev.preventDefault(); }
});
$('#zIn').addEventListener('click', () => zoomAt(1.25));
$('#zOut').addEventListener('click', () => zoomAt(0.8));
$('#btnFit').addEventListener('click', () => fitRect(WORLD));
$('#btnFitBand').addEventListener('click', () => { const g = groups.find((x) => x.id === $('#bandSel').value) || currentBand(); if (g) fitBand(g.id); });
let selectBusy = false;
$('#bandSel').innerHTML = groups.map((g) => `<option value="${g.id}">${esc(bandLabel(g))}</option>`).join('');
$('#bandSel').addEventListener('change', (ev) => { selectBusy = true; fitBand(ev.target.value); setTimeout(() => (selectBusy = false), 400); });

// ---------- search ----------
let hits = [], hitI = -1;
$('#q').addEventListener('input', (ev) => {
  const q = ev.target.value.trim().toLowerCase();
  world.querySelectorAll('.node.hit').forEach((e) => e.classList.remove('hit'));
  hits = []; hitI = -1;
  if (q.length >= 2) {
    hits = [...nodeById.values()].filter((n) => n.id.toLowerCase().includes(q) || (n.label || '').toLowerCase().includes(q) || (n.route || '').toLowerCase().includes(q) || (n.title || '').toLowerCase().includes(q));
    hits.forEach((n) => { const el = nodeEl(n.id); if (el) el.classList.add('hit'); });
  }
  $('#qcount').textContent = q.length >= 2 ? (hits.length ? `${hits.length}` : '0') : '';
});
$('#q').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' || !hits.length) return;
  ev.preventDefault();
  hitI = (hitI + (ev.shiftKey ? -1 : 1) + hits.length) % hits.length;
  $('#qcount').textContent = `${hitI + 1} of ${hits.length}`;
  goNode(hits[hitI].id);
});

// ---------- refinements panel and counter ----------
function renderCounter() {
  const c = MODE === 'tobe' ? REFS.countsTobe : REFS.counts;
  $('#counter').innerHTML = '<span class="lbl">Refinements:</span>' + STATUS.filter((s) => c[s] !== undefined || s === 'done').map((s) =>
    `<button class="pill st-${s}" data-status="${s}" aria-pressed="${filter.status.has(s)}" title="Show or hide ${STATUS_NAME[s].toLowerCase()} refinements"><span class="dot"></span><span class="t">${c[s] || 0} ${STATUS_NAME[s].toLowerCase()}</span></button>`).join('');
  $('#refsummary').textContent = `${REFS.matrixRows} notes-matrix rows plus ${c.keep || 0} keep checks. ${REFS.placedRows} rows sit on nodes; the rest are website or docs work. Numbers match the badges on the map.${MODE === 'tobe' ? ' To-be shows each row\'s status on the branch: done, preview, engineer handoff or question.' : ''}`;
}
$('#counter').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-status]'); if (!b) return;
  const s = b.dataset.status;
  if (filter.status.has(s)) filter.status.delete(s); else filter.status.add(s);
  renderCounter(); renderList(); rerenderBadges();
});
const areas = [...new Set(refs.map((r) => r.area))];
$('#areaSel').innerHTML = `<option value="">All areas</option>` + areas.map((a) => `<option>${esc(a)}</option>`).join('');
$('#areaSel').addEventListener('change', (ev) => { filter.area = ev.target.value; renderList(); rerenderBadges(); });
$('#refq').addEventListener('input', (ev) => { filter.q = ev.target.value.trim(); renderList(); rerenderBadges(); });
function renderList() {
  const rows = refs.filter(visibleRef);
  $('#reflist').innerHTML = rows.map((r) => `<div class="refrow" role="listitem" tabindex="0" data-ref="${esc(r.id)}" aria-label="Refinement ${r.n}, ${esc(r.id)}, ${STATUS_NAME[r.status]}: ${esc(r.title)}">
    <span class="nb st-${r.status} num"><span>${r.n}</span></span>
    <div class="head"><span class="rid">${esc(r.id)}</span><span class="pill st-${r.status}"><span class="dot"></span><span class="t">${STATUS_NAME[r.status]}</span></span></div>
    <div class="ttl">${esc(r.title)}</div>
    <div class="chips">${r.nodeIds.length ? r.nodeIds.map((id) => `<button class="chip" data-go="${id}" aria-label="Go to node ${id}">${id}</button>`).join('') : `<span class="chip off">Not on the map: ${esc(r.offMap)}</span>`}</div>
  </div>`).join('') || '<p style="padding:16px;color:var(--ink-3)">No refinements match.</p>';
}
$('#reflist').addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]');
  if (go) { ev.stopPropagation(); goNode(go.dataset.go); return; }
  const row = ev.target.closest('.refrow'); if (row) openRef(row.dataset.ref);
});
$('#reflist').addEventListener('keydown', (ev) => {
  const row = ev.target.closest('.refrow'); if (row && (ev.key === 'Enter' || ev.key === ' ') && ev.target === row) { ev.preventDefault(); openRef(row.dataset.ref); }
});
const refpanel = $('#refpanel');
$('#btnRefs').addEventListener('click', () => {
  refpanel.hidden = !refpanel.hidden; $('#btnRefs').setAttribute('aria-pressed', String(!refpanel.hidden));
  requestAnimationFrame(applyCam);
});
renderCounter(); renderList(); buildOverlay();

// ---------- As-is / To-be ----------
// As-is: statuses as planned against develop. To-be: statuses on the branch (done, preview, handoff, question, keep).
// Website and docs rows that are not on the map and not built yet read "Not built yet" in To-be.
function setMode(tobe) {
  MODE = tobe ? 'tobe' : 'asis';
  $('#segAsis').setAttribute('aria-pressed', String(!tobe)); $('#segTobe').setAttribute('aria-pressed', String(tobe));
  STATUS_NAME.planned = tobe ? 'Not built yet' : 'Planned';
  refs.forEach((r) => { r.status = tobe ? r.tobe : r.asis; });
  filter.status = new Set(STATUS);
  $('#brandSub').textContent = tobe ? `User flows · to-be · ${REFS.tobeMeta.updated}` : 'User flows · as-is';
  const tp = world.querySelector('.titlepanel'); if (tp) tp.outerHTML = titleSVG();
  if (!drawer.hidden) closeDrawer();
  $('#legendBody').innerHTML = legendHTML();
  renderCounter(); renderList(); rerenderBadges();
}
$('#segAsis').addEventListener('click', () => setMode(false));
$('#segTobe').addEventListener('click', () => setMode(true));

// ---------- legend ----------
function legendItems() {
  const s = (type, label, extra = {}) => { const n = { id: 'L', type, label, lines: [], ...extra }; return n; };
  const mk = (n, w = 56, h = 30) => {
    const sc = n.type === 'decision' ? 0.32 : 0.3;
    const W = { term: 180, page: 196, action: 172, system: 172, data: 184, sub: 180, note: 232, doc: 232, decision: 180 }[n.type] || 26;
    const H = { term: 44, page: 56, action: 54, system: 52, data: 54, sub: 52, note: 48, doc: 48, decision: 92 }[n.type] || 26;
    n.w = W; n.h = H;
    return `<svg viewBox="${-w / 2 / sc} ${-h / 2 / sc} ${w / sc} ${h / sc}" aria-hidden="true"><g class="node t-${n.type}">${shapeSVG(n)}${CONNECTOR.has(n.type) ? `<text class="ltr" y="4.5">${n.l}</text>` : ''}</g></svg>`;
  };
  const line = (cls) => `<svg viewBox="0 0 56 30" aria-hidden="true"><path class="edge ${cls}" d="M4,15 H50"/></svg>`;
  const chip = `<svg viewBox="0 0 56 30" aria-hidden="true"><g class="elabel" transform="translate(28,15)"><rect x="-14" y="-9" width="28" height="18" rx="3"/><text text-anchor="middle" y="4" style="font-size:12px">Yes</text></g></svg>`;
  const badge = (st) => `<svg viewBox="0 0 56 30" aria-hidden="true"><g class="badge"><rect class="fill-${st}" x="17" y="5" width="22" height="20" rx="10"/><text x="28" y="19">7</text></g></svg>`;
  return [
    [mk(s('term')), 'Entry or exit'], [mk(s('page')), 'Page or screen'], [mk(s('action')), 'User action'], [mk(s('system')), 'System response'],
    [mk(s('decision')), 'Decision'], [chip, 'Branch value on a decision exit'], [mk(s('data')), 'Data or state, with its /api/v1 route'],
    [mk(s('sub')), 'Sub-flow reference (drawn in the bottom row)'], [mk(s('note')), 'Note or gap'],
    [mk(s('hub', '', { l: 'B' })), 'Hub: the idle page every branch returns to'], [mk(s('ret', '', { l: 'B' })), 'Return to the hub with the same letter'],
    [mk(s('anchor', '', { l: 'A' })), 'Page anchor: where jumps land'], [mk(s('jump', '', { l: 'A' })), 'Jump to the anchor with the same letter'],
    [line('flow'), 'Flow'], [line('backnav'), 'Back-navigation or hand-off to another journey'], [line('ref'), 'Reference to a note'],
    [`<svg viewBox="0 0 56 30" aria-hidden="true"><g class="tags"><rect x="2" y="6" width="52" height="18" rx="5"/><text x="9" y="19" style="font-size:11px">flag</text></g></svg>`, 'Feature flag that gates the node'],
    ...STATUS.map((st) => [badge(st), `Refinement: ${STATUS_NAME[st].toLowerCase()}`]),
  ];
}
const legendHTML = () => `<div class="lg">${legendItems().map(([a, b]) => `${a}<span>${esc(b)}</span>`).join('')}</div>`;
$('#legendBody').innerHTML = legendHTML();
const layer = (id, cls) => $(id).addEventListener('change', (ev) => { svg.classList.toggle(cls, !ev.target.checked); });
layer('#lyBadges', 'hide-badges'); layer('#lyFlags', 'hide-flags'); layer('#lyBack', 'hide-backnav'); layer('#lyRef', 'hide-ref'); layer('#lyNotes', 'hide-notes');
// the legend starts collapsed below 1700px so it does not cover a fitted band; the viewer's choice is remembered
let legendPref = null; try { legendPref = localStorage.getItem('fm1-legend'); } catch (e) { /* storage blocked */ }
if (legendPref === 'closed' || (legendPref !== 'open' && innerWidth < 1700)) $('#legend').open = false;
$('#legend').addEventListener('toggle', () => { try { localStorage.setItem('fm1-legend', $('#legend').open ? 'open' : 'closed'); } catch (e) { /* storage blocked */ } });

// ---------- print: one band per page, legend on each ----------
function buildPrint() {
  const legend = legendHTML();
  let out = `<section class="ppage tall"><div class="pmain"><div><h2>${esc(FLOWS.meta.wordmark)} · user flows</h2><p class="pmeta">${esc(curMeta().prepared)} · ${esc(curMeta().updated)} · ${esc(curMeta().round)}</p></div><svg class="pband" viewBox="${titleRect.x} ${titleRect.y} ${titleRect.w} ${titleRect.h}">${titleSVG()}</svg></div><div class="plegend"><h3>Legend</h3>${legend}</div></section>`;
  groups.forEach((g, i) => {
    // crop to the drawn content; the page heading replaces the band label
    const r = { x: g.ox - 30, y: g.rect.y + 34, w: g.cw + 60, h: g.rect.h - 34 };
    out += `<section class="ppage${r.h > r.w * 0.9 ? ' tall' : ''}"><div class="pmain"><div><h2>${esc(bandLabel(g))}</h2><p class="pmeta">${esc(g.persona || g.from || '')}</p></div><svg class="pband" viewBox="${r.x} ${r.y} ${r.w} ${r.h}" preserveAspectRatio="xMidYMin meet">${bandSVG(g, i)}</svg></div><div class="plegend"><h3>Legend</h3>${legend}</div></section>`;
  });
  $('#print').innerHTML = out;
}
buildPrint();

// ---------- deep links and first view ----------
function fromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!h) return false;
  if (h === 'tobe' || h === 'asis') { setMode(h === 'tobe'); return false; }
  const m = h.match(/^(node|band)=(.+)$/);
  const key = m ? m[2] : h;
  if ((!m || m[1] === 'node') && nodeById.has(key)) { goNode(key, { animate: false }); return true; }
  if ((!m || m[1] === 'band') && groups.some((g) => g.id === key)) { fitBand(key); return true; }
  return false;
}
window.addEventListener('hashchange', fromHash);
function firstView() {
  if (fromHash()) return;
  // open on the title panel and band 1 at a readable scale
  const r = { x: 0, y: 0, w: Math.min(WORLD.w, titleRect.w + journeys[0].cw + PAD_X * 2 + 60), h: journeys[0].rect.h };
  fitRect(r, false);
}
if (window.matchMedia('(max-width: 900px)').matches) { refpanel.hidden = true; $('#btnRefs').setAttribute('aria-pressed', 'false'); $('#legend').open = false; }
applyCam();
requestAnimationFrame(firstView);
window.addEventListener('resize', () => updateMini());
window.__fm1 = { bandBox, fitBand, visibleBox, fitRect, openNode, openRef, openBand, goNode, WORLD, groups, C, applyCam, zoomAt, centerOn };
})();
</script>
</body>
