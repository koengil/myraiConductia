<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conductia · Integrated</title>
<link rel="stylesheet" href="../shared/brand-tokens.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../shared/fixtures.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: {
      sans: ['Inter', 'system-ui', 'sans-serif'],
      mono: ['Geist Mono', 'ui-monospace', 'monospace'],
      display: ['Fraunces', 'Georgia', 'serif'],
    } } },
  };
</script>
<style>
  :root { color-scheme: dark; }
  * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--canvas-bg); color: var(--ink-on-dark);
    font-family: var(--font-sans); font-size: var(--text-base); line-height: 1.45; overflow: hidden;
  }

  /* ── Surfaces / panels ─────────────────────────────────────── */
  .panel { background: linear-gradient(180deg, rgba(20,37,77,.55) 0%, rgba(10,18,40,.55) 100%); border: 1px solid rgba(174,184,204,.10); border-radius: var(--radius-card); }
  .panel-flat { background: rgba(20,37,77,.32); border: 1px solid rgba(174,184,204,.10); border-radius: var(--radius-card); }
  .grid-tex { background-image: var(--texture-grid); }

  /* ── Text helpers ──────────────────────────────────────────── */
  .ink-2 { color: var(--ink-on-dark-secondary); }
  .ink-3 { color: var(--ink-on-dark-tertiary); }
  .accent { color: var(--accent); }
  .buyer-ink { color: #E0A86B; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .label-eyebrow { font-family: var(--font-mono); font-size: var(--text-xxs); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-on-dark-tertiary); }
  .h-section { font-weight: 600; letter-spacing: -.01em; }
  .glow-accent { text-shadow: 0 0 18px rgba(194,148,69,.35); }
  .glow-soft { box-shadow: 0 0 0 1px rgba(194,148,69,.35), 0 0 28px rgba(194,148,69,.14); }

  /* ── Nav ───────────────────────────────────────────────────── */
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--ink-on-dark-secondary); cursor: pointer; transition: background .18s ease, color .18s ease; min-height: 44px; width: 100%; text-align: left; border: 1px solid transparent; }
  .nav-item:hover { background: rgba(174,184,204,.07); color: var(--ink-on-dark); }
  .nav-item.active { background: rgba(194,148,69,.12); color: var(--ink-on-dark); border-color: rgba(194,148,69,.30); }
  .nav-item.active .nav-ico { color: var(--accent); }
  .nav-ico { color: var(--ink-on-dark-tertiary); flex: 0 0 auto; }
  .nav-item.locked { opacity: .42; cursor: not-allowed; }
  .nav-item.locked:hover { background: transparent; color: var(--ink-on-dark-secondary); }

  /* ── Pills / chips ─────────────────────────────────────────── */
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: var(--text-xxs); letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: var(--radius-pill); border: 1px solid rgba(174,184,204,.20); color: var(--ink-on-dark-secondary); }
  .chip-accent { color: var(--accent); border-color: rgba(194,148,69,.40); background: rgba(194,148,69,.08); }
  .chip-clear { color: #6FD49E; border-color: rgba(45,126,84,.45); background: rgba(45,126,84,.14); }
  .chip-hold  { color: #E2B35A; border-color: rgba(176,122,26,.45); background: rgba(176,122,26,.14); }
  .chip-block { color: #F08A72; border-color: rgba(209,75,48,.45); background: rgba(209,75,48,.14); }
  .chip-buyer { color: #E0A86B; border-color: rgba(200,140,80,.45); background: rgba(200,140,80,.12); }
  .chip-client { color: #9FB8E6; border-color: rgba(120,150,210,.45); background: rgba(120,150,210,.12); }
  .client-ink { color: #9FB8E6; }

  .tone-strong { color: #6FD49E; } .tone-watch { color: #E2B35A; } .tone-risk { color: #F08A72; }
  .bg-strong { background: rgba(45,126,84,.20); border-color: rgba(45,126,84,.40); }
  .bg-watch  { background: rgba(176,122,26,.18); border-color: rgba(176,122,26,.40); }
  .bg-risk   { background: rgba(209,75,48,.18); border-color: rgba(209,75,48,.40); }

  /* ── Buttons ───────────────────────────────────────────────── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--radius-button); font-weight: 600; font-size: var(--text-base); cursor: pointer; transition: all .18s ease; border: 1px solid transparent; }
  .btn-gold { background: var(--accent); color: #1A1304; }
  .btn-gold:hover { background: #d3a558; box-shadow: 0 0 24px rgba(194,148,69,.30); }
  .btn-ghost { background: rgba(174,184,204,.06); color: var(--ink-on-dark); border-color: rgba(174,184,204,.16); }
  .btn-ghost:hover { background: rgba(174,184,204,.12); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ── Tables ────────────────────────────────────────────────── */
  table.league { width: 100%; border-collapse: collapse; }
  table.league th { font-family: var(--font-mono); font-size: var(--text-xxs); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-on-dark-tertiary); text-align: left; padding: 10px 14px; border-bottom: 1px solid rgba(174,184,204,.12); cursor: pointer; user-select: none; white-space: nowrap; }
  table.league th:hover { color: var(--ink-on-dark); }
  table.league td { padding: 14px; border-bottom: 1px solid rgba(174,184,204,.07); vertical-align: middle; }
  table.league tbody tr { cursor: pointer; transition: background .15s ease; }
  table.league tbody tr:hover { background: rgba(194,148,69,.06); }

  /* ── Segmented / persona control ───────────────────────────── */
  .seg { display: inline-flex; gap: 4px; padding: 4px; background: rgba(10,18,40,.6); border: 1px solid rgba(174,184,204,.12); border-radius: var(--radius-pill); }
  .seg button { min-height: 36px; padding: 0 14px; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 500; color: var(--ink-on-dark-secondary); cursor: pointer; transition: all .18s ease; white-space: nowrap; border: none; background: none; display:inline-flex; align-items:center; gap:7px; }
  .seg button:hover { color: var(--ink-on-dark); }
  .seg button.on { background: rgba(194,148,69,.16); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(194,148,69,.30); }
  .seg button.on-buyer { background: rgba(200,140,80,.18); color: #E0A86B; box-shadow: inset 0 0 0 1px rgba(200,140,80,.40); }
  .seg button.on-client { background: rgba(120,150,210,.18); color: #9FB8E6; box-shadow: inset 0 0 0 1px rgba(120,150,210,.40); }

  /* ── Score dial ────────────────────────────────────────────── */
  .dial-track { stroke: rgba(174,184,204,.14); } .dial-fin { stroke: var(--accent); } .dial-cul { stroke: #6FD49E; }

  /* ── Entities (Beat 4) ─────────────────────────────────────── */
  .entity { border: 1px solid rgba(174,184,204,.14); border-radius: var(--radius-card); background: rgba(20,37,77,.32); padding: 18px 20px; }
  .entity.future { border-style: dashed; border-color: rgba(174,184,204,.28); opacity: .66; background: rgba(20,37,77,.16); }
  .person-row { display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid rgba(174,184,204,.07); }
  .person-row:last-child { border-bottom:none; }
  .avatar { width:32px; height:32px; border-radius:9999px; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:var(--text-xs); flex:0 0 auto; background:rgba(194,148,69,.16); color:var(--accent); }
  .avatar.buyer { background:rgba(200,140,80,.18); color:#E0A86B; }
  .avatar.client { background:rgba(120,150,210,.18); color:#9FB8E6; }
  .avatar.add { background:rgba(174,184,204,.10); color:var(--ink-on-dark-tertiary); border:1px dashed rgba(174,184,204,.3); }

  /* ── Departure cascade (Beat 11) ───────────────────────────── */
  .revrow { display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:11px; border:1px solid rgba(174,184,204,.10); background:rgba(20,37,77,.3); opacity:.4; transform:translateY(4px); transition:all .4s ease; }
  .revrow.done { opacity:1; transform:none; border-color:rgba(45,126,84,.40); background:rgba(45,126,84,.10); }

  /* viewing-as banner */
  .asbanner { display:none; align-items:center; gap:11px; padding:11px 28px; background:rgba(174,184,204,.06); border-bottom:1px solid rgba(174,184,204,.18); }

  /* football field */
  .ff-track { background: rgba(174,184,204,.10); border-radius: 9999px; height: 10px; position: relative; }
  .ff-fill { position: absolute; top: 0; bottom: 0; border-radius: 9999px; }

  /* focus + scroll + fades */
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .scroll-area { overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(174,184,204,.25) transparent; }
  .scroll-area::-webkit-scrollbar { width: 9px; }
  .scroll-area::-webkit-scrollbar-thumb { background: rgba(174,184,204,.2); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
  .view-fade { animation: fade .26s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

  /* ── Responsive ───────────────────────────────────────────── */
  .rail { transition: width .2s ease; }
  @media (max-width: 1040px) { .persona-seg-label { display:none !important; } }
  @media (max-width: 900px) {
    .rail-labels { display: none !important; }
    .rail { width: 64px !important; }
    .rail-collapse-btn, .profile-meta, .deal-switcher { display: none !important; }
  }
  @media (max-width: 640px) {
    .shell { flex-direction: column; }
    .rail { width: 100% !important; height: 56px; flex-direction: row !important; align-items: center; overflow-x: auto; padding: 0 8px !important; gap: 4px; order: 2; border-top: 1px solid rgba(174,184,204,.12); border-right: none !important; }
    .rail-top, .rail-foot, .rail-deal { display: none !important; }
    .rail-nav { flex-direction: row !important; gap: 4px !important; }
    .nav-item { min-width: 48px; justify-content: center; padding: 8px !important; }
    .content { order: 1; }
  }
</style>
</head>
<body>
<div class="shell" style="display:flex; height:100vh; width:100vw;">

  <!-- ════════════════════════ LEFT RAIL ════════════════════════ -->
  <aside id="rail" class="rail grid-tex" style="width:256px; flex:0 0 auto; display:flex; flex-direction:column; background:linear-gradient(180deg,#0c1530 0%,#070d1c 100%); border-right:1px solid rgba(174,184,204,.10); padding:16px 12px;">
    <div class="rail-top" style="display:flex; align-items:center; justify-content:space-between; padding:6px 8px 18px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:30px;height:30px;border-radius:9px;background:var(--ink);border:1px solid rgba(194,148,69,.4);display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
        </div>
        <span class="rail-labels" style="font-weight:600; letter-spacing:-.01em; font-size:15px;">Intel<span class="accent">i</span>bank</span>
      </div>
      <button class="rail-collapse-btn" onclick="toggleRail()" aria-label="Collapse navigation" style="background:none;border:none;color:var(--ink-on-dark-tertiary);cursor:pointer;padding:6px;border-radius:8px;display:flex;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <div class="rail-deal deal-switcher" style="margin:0 4px 16px; position:relative;">
      <button onclick="toggleDealMenu()" aria-haspopup="listbox" style="width:100%; text-align:left; background:rgba(174,184,204,.06); border:1px solid rgba(174,184,204,.14); border-radius:10px; padding:9px 12px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px;">
        <span style="overflow:hidden;">
          <span class="label-eyebrow" style="display:block;">Mandate</span>
          <span id="dealLabel" class="rail-labels" style="font-weight:600; font-size:var(--text-sm); white-space:nowrap;">Project Atlas</span>
        </span>
        <svg class="rail-labels" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-on-dark-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4"/><path d="M16 15l-4 4-4-4"/></svg>
      </button>
      <div id="dealMenu" role="listbox" style="display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); background:#0c1530; border:1px solid rgba(174,184,204,.18); border-radius:12px; box-shadow:var(--elev-float); z-index:30; overflow:hidden;"></div>
    </div>

    <nav class="rail-nav" style="display:flex; flex-direction:column; gap:3px; flex:1 1 auto;" id="nav"></nav>

    <div class="rail-foot" style="margin-top:12px; padding-top:14px; border-top:1px solid rgba(174,184,204,.10);">
      <div style="display:flex; align-items:center; gap:9px; padding:4px 10px 14px;">
        <span class="ib-pulse-dot" aria-hidden="true"></span>
        <span class="rail-labels" style="letter-spacing:.1em;">Compliance live</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px; padding:8px 8px; background:rgba(174,184,204,.05); border:1px solid rgba(174,184,204,.10); border-radius:12px;">
        <div class="avatar" id="profInitials" style="width:34px;height:34px;">SD</div>
        <div class="profile-meta rail-labels" style="overflow:hidden;">
          <span id="profName" style="display:block; font-family:var(--font-sans); font-weight:600; font-size:var(--text-sm); color:var(--ink-on-dark); letter-spacing:0; text-transform:none;">Storm Duncan</span>
          <span id="profRole" style="display:block; letter-spacing:.04em;">Managing Director</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ════════════════════════ CONTENT ════════════════════════ -->
  <main class="content scroll-area" id="content" style="flex:1 1 auto; overflow-y:auto; background:var(--bg-cinematic); position:relative;">
    <header style="position:sticky; top:0; z-index:20; backdrop-filter:blur(14px); background:rgba(8,14,32,.72); border-bottom:1px solid rgba(174,184,204,.10);">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 28px; flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:14px; min-width:0;">
          <h1 id="viewTitle" class="h-section" style="font-size:var(--text-lg); margin:0; white-space:nowrap;">Mandate</h1>
          <span class="chip mono" style="border-color:rgba(194,148,69,.3);"><span class="accent">ATLAS-2026-001</span></span>
          <span class="chip" id="stageChip">Buyer outreach</span>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <!-- PERSONA SWITCH — the signature interaction (bank / client / buyer) -->
          <div class="seg persona-seg" role="group" aria-label="Perspective">
            <button id="persona_storm" class="on" onclick="setActor('storm')" aria-pressed="true">
              <span class="avatar" style="width:18px;height:18px;font-size:9px;">SD</span><span class="persona-seg-label">You · Storm (MD)</span>
            </button>
            <button id="persona_mike" onclick="setActor('mike')" aria-pressed="false">
              <span class="avatar client" style="width:18px;height:18px;font-size:9px;">MC</span><span class="persona-seg-label">Client · Atlassian</span>
            </button>
            <button id="persona_dana" onclick="setActor('dana')" aria-pressed="false">
              <span class="avatar buyer" style="width:18px;height:18px;font-size:9px;">DC</span><span class="persona-seg-label">Buyer · Anthropic</span>
            </button>
          </div>
          <div data-compliance-status="topbar" style="display:flex; align-items:center; gap:9px; padding:6px 12px; background:rgba(45,126,84,.12); border:1px solid rgba(45,126,84,.35); border-radius:9999px;">
            <span class="ib-pulse-dot" aria-hidden="true"></span>
            <span class="mono" style="font-size:var(--text-xs); color:#6FD49E; letter-spacing:.08em;">COMPLIANCE · CLEAR</span>
          </div>
        </div>
      </div>
      <!-- viewing-as banner (non-bank actors) -->
      <div id="asBanner" class="asbanner">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-on-dark-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="ink-2" style="font-size:var(--text-sm);" id="asBannerText"></span>
      </div>
    </header>

    <div id="viewRoot" style="padding:28px; max-width:1320px; margin:0 auto;"></div>

    <footer style="padding:14px 28px 110px; max-width:1320px; margin:0 auto; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-top:1px solid rgba(174,184,204,.08); margin-top:8px;">
      <span class="chip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 2"/></svg>Future-vision · integrated</span>
      <span class="ink-3" style="font-size:var(--text-xs);">Conductia · One platform. Permissions computed per actor.</span>
    </footer>
  </main>

</div>

<script>
/* ════════════════════════════════════════════════════════════════
   Conductia — INTEGRATED. A1 platform shell + Martin's three Storm-
   validated beats woven in as live platform mechanics:
     · Beat 7  "The other side"  -> persona switch (Storm <-> Dana Cole)
     · Beat 4  "Entities first"   -> entity-first Deal Team + lock gate
     · Beat 11 "Someone leaves"   -> departure cascade across deals
   Vanilla JS over window.IB. Numbers are canonical (computed scores,
   Mike Cannon-Brookes). Navy+gold via shared/brand-tokens.css.
   ════════════════════════════════════════════════════════════════ */
const IB = window.IB;
const fmt = IB.fmtUsd;

/* ── icons ─────────────────────────────────────────────────── */
const I = {
  mandate:  '<path d="M8 6h8M8 10h8M8 14h5"/><rect x="4" y="3" width="16" height="18" rx="2"/>',
  acquirers:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/>',
  team:     '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  dataroom: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  skills:   '<path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1L12 16.8 5.7 21l2.3-7.1-6-4.5h7.6z"/>',
  audit:    '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  eye:      '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  lock:     '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
};
function ico(p, size=18, color='currentColor', sw=1.7) {
  return `<svg class="nav-ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* ── PERSONA / PERMISSION MODEL (Beat 7) ───────────────────────
   Three actors, one interface. Storm's words: "the platform is for a buyer or a
   seller and everybody can access it... they should see the exact same system as
   everybody else, but they only have their permissions." */
const ACTORS = {
  storm: { name:'Storm Duncan', role:'Managing Director · your bank', initials:'SD', cls:'', banner:'' },
  mike:  { name:'Mike Cannon-Brookes', role:'CEO · Atlassian (client)', initials:'MC', cls:'client',
           bannerHtml: 'You are seeing <span class="client-ink" style="font-weight:600;">Atlassian\'s</span> view (the client). Same platform, permissions computed per actor.' },
  dana:  { name:'Dana Cole', role:'Corp Dev · Anthropic (buyer)', initials:'DC', cls:'buyer',
           bannerHtml: 'You are seeing <span class="buyer-ink" style="font-weight:600;">Anthropic\'s</span> view (the buyer). Same platform, permissions computed per actor.' },
};
// Destinations each actor can reach. Everything else is removed from their menu.
const ALLOWED = {
  storm: ['mandate','acquirers','team','dataroom','skills','audit'],
  mike:  ['mandate','acquirers','dataroom'],
  dana:  ['mandate','dataroom'],
};
let actor = 'storm';
function isBuyer()  { return actor === 'dana'; }
function isClient() { return actor === 'mike'; }
function allowed(viewId) {
  if (viewId === 'deepdive') return ALLOWED[actor].includes('acquirers');
  return ALLOWED[actor].includes(viewId);
}

/* ── nav model ─────────────────────────────────────────────── */
const NAV = [
  { id: 'mandate',   label: 'Mandate',          buyerLabel: 'The deal', clientLabel: 'The deal', icon: I.mandate },
  { id: 'acquirers', label: 'Acquirers',        icon: I.acquirers },
  { id: 'team',      label: 'Deal Team',        icon: I.team },
  { id: 'dataroom',  label: 'Data Room',        icon: I.dataroom },
  { id: 'skills',    label: 'Skills',           icon: I.skills },
  { id: 'audit',     label: 'Audit & Lifecycle',icon: I.audit },
];

/* ════════════ PERSONA SWITCH ════════════ */
function setActor(key) {
  if (actor === key) return;
  actor = key;
  const a = ACTORS[key];
  // topbar segmented control
  document.querySelectorAll('.persona-seg button').forEach(b => { b.classList.remove('on','on-buyer','on-client'); b.setAttribute('aria-pressed','false'); });
  const btn = document.getElementById('persona_' + key);
  if (btn) { btn.classList.add(key==='storm'?'on':(key==='dana'?'on-buyer':'on-client')); btn.setAttribute('aria-pressed','true'); }
  // rail persona card flips to the active actor
  const pi = document.getElementById('profInitials');
  pi.textContent = a.initials; pi.className = 'avatar ' + a.cls;
  document.getElementById('profName').textContent = a.name;
  document.getElementById('profRole').textContent = a.role;
  // viewing-as banner for non-bank actors
  const bn = document.getElementById('asBanner');
  if (key === 'storm') { bn.style.display = 'none'; }
  else { bn.style.display = 'flex'; document.getElementById('asBannerText').innerHTML = a.bannerHtml; }
  // external / client actors are scoped to a single deal — hide the mandate switcher
  document.querySelector('.deal-switcher').style.visibility = (key === 'storm') ? 'visible' : 'hidden';
  renderNav();
  // if the current destination is not in this actor's menu, fall back to the deal overview
  if (!allowed(currentView)) currentView = 'mandate';
  go(currentView);
}

/* ════════════ NAV RENDER ════════════
   Sealed destinations are removed from the menu, not shown disabled — each actor
   sees only the destinations their permissions grant. */
function renderNav() {
  document.getElementById('nav').innerHTML = NAV.filter(n => allowed(n.id)).map(n => {
    const active = currentView===n.id || (currentView==='deepdive'&&n.id==='acquirers');
    const label = (isBuyer() && n.buyerLabel) ? n.buyerLabel : ((isClient() && n.clientLabel) ? n.clientLabel : n.label);
    return `<button class="nav-item ${active?'active':''}" onclick="go('${n.id}')" aria-label="${label}">
      ${ico(n.icon)}
      <span class="rail-labels" style="font-weight:500; font-size:var(--text-sm);">${label}</span>
    </button>`;
  }).join('');
}

/* ════════════ DEAL SWITCHER ════════════ */
function renderDealMenu() {
  document.getElementById('dealMenu').innerHTML = IB.deals.map((d,i) => `
    <button onclick="pickDeal(${i})" role="option" style="width:100%; text-align:left; background:none; border:none; border-bottom:1px solid rgba(174,184,204,.08); padding:11px 13px; cursor:pointer; display:flex; flex-direction:column; gap:2px; min-height:44px;"
      onmouseover="this.style.background='rgba(194,148,69,.08)'" onmouseout="this.style.background='none'">
      <span style="display:flex; align-items:center; gap:8px;">
        <span style="font-weight:600; font-size:var(--text-sm); color:var(--ink-on-dark);">${d.codename}</span>

      </span>
      <span class="mono ink-3" style="font-size:var(--text-xxs);">${d.code} · ${d.target} · ${d.stage}</span>
    </button>`).join('');
}
function toggleDealMenu(){ const m = document.getElementById('dealMenu'); m.style.display = m.style.display==='none' ? 'block':'none'; }
function pickDeal(i){
  const d = IB.deals[i];
  document.getElementById('dealLabel').textContent = d.codename;
  document.getElementById('stageChip').textContent = d.stage;
  const codeChip = document.querySelector('header .chip.mono span');
  if (codeChip) codeChip.textContent = d.code;
  toggleDealMenu();
  go('mandate');
}

/* ════════════ ROUTER ════════════ */
function go(view, acqId) {
  if (!allowed(view)) view = 'mandate';
  currentView = view;
  if (acqId) currentAcquirer = acqId;
  renderNav();
  document.getElementById('viewTitle').textContent = TITLES[view];
  const root = document.getElementById('viewRoot');
  root.classList.remove('view-fade'); void root.offsetWidth; root.classList.add('view-fade');
  document.getElementById('content').scrollTop = 0;
  const map = {
    mandate:   isBuyer() ? viewBuyerDeal : (isClient() ? viewClientDeal : viewMandate),
    acquirers: viewAcquirers, deepdive: viewDeepDive, team: viewTeam,
    dataroom:  viewDataRoom, skills: viewSkills, audit: viewAudit,
  };
  map[view]();
}

const classTone = { 1:'chip-clear', 2:'chip', 3:'chip-hold', 4:'chip-block' };

function setPhase(p) {

function renderDocRows(phase) {
  const rows = IB.documents.map(d => {
    const visible = phase >= d.minPhase;

    if (isBuyer() && !visible) return '';
    return `<tr style="cursor:default; opacity:${visible?1:.55};">
      <td><div style="display:flex; align-items:center; gap:10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-on-dark-tertiary)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <span style="font-weight:500; color:var(--ink-on-dark);">${d.name}</span></div></td>
      <td><span class="chip ${classTone[d.classification]}">C${d.classification} · ${d.label}</span></td>
      <td style="text-align:center;" class="mono ink-2">${d.minPhase===0?'Open':'P'+d.minPhase}</td>
      <td style="text-align:center;">${visible
        ? '<span class="chip chip-clear" style="padding:1px 8px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>Visible</span>'

      <td style="text-align:right;"><button class="btn btn-ghost" onclick="viewDoc('${d.name.replace(/'/g,'')}')" style="min-height:34px; padding:0 12px; font-size:var(--text-xs);" ${visible?'':'disabled'}>View</button></td>
    </tr>`;
  }).join('');
  const buyerGatedCount = isBuyer() ? IB.documents.filter(d => buyerPhase < d.minPhase).length : 0;
  document.getElementById('docRows').innerHTML = rows + (buyerGatedCount ? `<tr style="cursor:default;"><td colspan="5"><div style="display:flex; align-items:center; gap:9px; padding:6px 4px;">${ico(I.lock,14,'var(--ink-on-dark-tertiary)',2)}<span class="ink-3" style="font-size:var(--text-xs);">${buyerGatedCount} more document${buyerGatedCount>1?'s':''} sealed until a later phase. The buyer cannot see that they exist.</span></div></td></tr>` : '');
}
function viewDoc(name) {
  const t = toast();
  t.innerHTML = `<span class="ib-pulse-dot"></span><span class="ink-2" style="font-size:var(--text-sm);">Audit trail written · <span style="color:var(--ink-on-dark);">${ACTORS[actor].name}</span> viewed ${name}</span>`;
  t.style.borderColor = 'rgba(45,126,84,.4)';
  showToast(t);
}

/* ════════════ VIEW: SKILLS ════════════ */

      ${IB.skills.map(s => `

            ${s.premium ? '<span class="chip chip-accent"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Pro</span>' : '<span class="chip chip-clear" style="padding:1px 8px;">Free</span>'}

        </div>`).join('')}

/* ════════════ VIEW: AUDIT & LIFECYCLE (Beat 11) ════════════ */
let leaveProcessed = false;
function viewAudit() {
  const actionTone = { grant:'chip-accent', view:'chip-clear', upload:'chip-hold' };
  document.getElementById('viewRoot').innerHTML = `
    ${sectionHead('Lifecycle event · entitlements follow employment', 'Process a departure', liveBadge())}
    <div class="panel" style="padding:24px; margin-bottom:28px;">
      <p class="ink-2" style="margin:0 0 18px; font-size:var(--text-sm); max-width:700px; line-height:1.55;">An associate on this deal resigns from the firm. The instant their company association ends, compliance revokes their access across every deal they touched. The deals stay. The team stays. The person is gone, and no one had to remember to off-board them.</p>
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:16px 18px; background:rgba(20,37,77,.32); border:1px solid rgba(174,184,204,.12); border-radius:13px; margin-bottom:16px;">
        <span class="avatar" style="width:38px;height:38px;">DK</span>
        <div style="flex:1 1 auto; min-width:160px;">
          <div style="font-weight:600; color:var(--ink-on-dark);">Devin Kerr</div>
          <div class="ink-3" style="font-size:var(--text-xs);">Associate · resigned from the firm, 16:20</div>
        </div>
        <button class="btn btn-gold" id="leaveBtn" onclick="processLeave()" ${leaveProcessed?'disabled':''}>
          ${ico(I.lock,15,'#1A1304',2)} ${leaveProcessed?'Processed':'Process the departure'}
        </button>
      </div>
      <div id="revRows" style="display:flex; flex-direction:column; gap:10px;"></div>
      <div id="revSummary" style="display:none; align-items:center; gap:9px; margin-top:14px; padding:11px 16px; background:rgba(45,126,84,.10); border:1px solid rgba(45,126,84,.35); border-radius:11px;"></div>
    </div>

    ${sectionHead('Immutable ledger · who, action, detail, time', 'Audit trail')}
    <div class="panel" style="padding:6px 6px 4px; overflow-x:auto;">
      <table class="league">
        <thead><tr><th style="width:80px;">Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead>
        <tbody>${IB.auditLog.map(a => `<tr style="cursor:default;">
          <td class="mono ink-3" style="font-size:var(--text-xs);">${a.ts}</td>
          <td><span style="font-weight:600; color:var(--ink-on-dark);">${a.actor}</span></td>
          <td><span class="chip ${actionTone[a.action]||''}">${a.action}</span></td>
          <td class="ink-2" style="font-size:var(--text-sm);">${a.detail}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
    <div style="display:flex; align-items:center; gap:9px; margin-top:14px;">
      ${ico(I.lock,15,'var(--ink-on-dark-tertiary)',1.7)}
      <span class="ink-3" style="font-size:var(--text-xs); font-family:var(--font-mono);">Append-only. Every document view, grant, departure, and intent screening is logged here.</span>
    </div>`;
  if (leaveProcessed) renderRevRows(true);
}
const LEAVE_DEALS = [
  { code:'ATLAS-2026-001', name:'Atlassian — this deal' },
  { code:'NIMBU-2026-014', name:'Project Nimbus — another mandate' },
  { code:'HELIO-2026-022', name:'Project Helios — another mandate' },
];
function renderRevRows(done) {
  document.getElementById('revRows').innerHTML = LEAVE_DEALS.map(d => `
    <div class="revrow ${done?'done':''}" data-code="${d.code}">
      <span class="mono accent" style="font-size:var(--text-xs); flex:0 0 auto;">${d.code}</span>
      <span class="ink-2" style="flex:1 1 auto; font-size:var(--text-sm);">${d.name}</span>
      <span class="chip ${done?'chip-clear':''}" style="flex:0 0 auto;">${done?'access revoked':'pending'}</span>
    </div>`).join('');
  if (done) {
    const s = document.getElementById('revSummary');
    s.style.display = 'flex';
    s.innerHTML = `<span class="ib-pulse-dot"></span><span class="ink-2" style="font-size:var(--text-sm);">Removed from <span style="color:var(--ink-on-dark);">3 deals</span> · compliance and admin signed off · deals intact.</span>`;
  }
}
function processLeave() {
  leaveProcessed = true;
  document.getElementById('leaveBtn').disabled = true;
  document.getElementById('leaveBtn').innerHTML = `${ico(I.lock,15,'#1A1304',2)} Processed`;
  renderRevRows(false);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rows = [...document.querySelectorAll('#revRows .revrow')];
  rows.forEach((r,i) => setTimeout(() => {
    r.classList.add('done');
    r.querySelector('.chip').className = 'chip chip-clear';
    r.querySelector('.chip').textContent = 'access revoked';
  }, reduce ? 60*(i+1) : 250 + i*420));
  setTimeout(() => {
    const s = document.getElementById('revSummary');
    s.style.display = 'flex';
    s.innerHTML = `<span class="ib-pulse-dot"></span><span class="ink-2" style="font-size:var(--text-sm);">Removed from <span style="color:var(--ink-on-dark);">3 deals</span> · compliance and admin signed off · deals intact.</span>`;
  }, reduce ? 220 : 1500);
}

/* ════════════ TOAST ════════════ */
function toast() {
  let t = document.getElementById('globalToast');
  if (!t) {
    t = document.createElement('div'); t.id = 'globalToast';
    t.style.cssText = 'display:none; position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#0c1530; border:1px solid rgba(45,126,84,.4); border-radius:10px; padding:11px 16px; box-shadow:var(--elev-float); z-index:70; align-items:center; gap:9px;';
    document.body.appendChild(t);
  }
  return t;
}
function showToast(t) { t.style.display = 'flex'; clearTimeout(window._gt); window._gt = setTimeout(()=>{ t.style.display='none'; }, 2600); }

/* ════════════ CHROME CONTROLS ════════════ */
let railOpen = true;
function toggleRail() {
  railOpen = !railOpen;
  const rail = document.getElementById('rail');
  document.querySelectorAll('.rail-labels').forEach(e => e.style.display = railOpen ? '' : 'none');
  document.querySelectorAll('.profile-meta, .deal-switcher').forEach(e => e.style.display = railOpen ? '' : 'none');
  rail.style.width = railOpen ? '256px' : '72px';
  const btn = document.querySelector('.rail-collapse-btn svg');
  if (btn) btn.style.transform = railOpen ? '' : 'rotate(180deg)';
}
function applyMdStack(){ const g = document.querySelector('.md-stack'); if(g && window.innerWidth<860) g.style.gridTemplateColumns='1fr'; }
function applyDdGrid(){ const g = document.querySelector('.dd-grid'); if(g && window.innerWidth<860) g.style.gridTemplateColumns='1fr'; }
window.addEventListener('resize', () => {
  const dr = document.querySelector('.dr-grid'); if(dr && !isBuyer()) dr.style.gridTemplateColumns = window.innerWidth<760?'1fr':'1fr 280px';
  applyMdStack(); applyDdGrid();
});
document.addEventListener('click', e => {
  const sw = document.querySelector('.deal-switcher');
  const m = document.getElementById('dealMenu');
  if (sw && m && !sw.contains(e.target)) m.style.display = 'none';
});

/* ════════════ BOOT ════════════ */
function boot() {
  document.getElementById('profInitials').textContent = ACTORS.storm.initials;
  document.getElementById('profName').textContent = ACTORS.storm.name;
  document.getElementById('profRole').textContent = ACTORS.storm.role;
  document.getElementById('dealLabel').textContent = IB.currentUser.mandate.codename;
  renderNav();
  renderDealMenu();
  go('mandate');
}
boot();
</script>
