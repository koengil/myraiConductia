name: AI review

# Advisory: this check is not part of any ruleset.
#
# CHECK IDENTITY: any workflow with checks: write can post a check named ai-review with GITHUB_TOKEN,
# so the required check must come from a dedicated GitHub App. When the AI_REVIEW_APP_ID and
# AI_REVIEW_APP_PRIVATE_KEY secrets are set, every step that posts (checks, reviews, comments,
# labels) uses that App's installation token (actions/create-github-app-token). When they are not
# set, the run stays advisory whatever gate.json says, logs why, and never posts a gate result.
# At flip time the develop ruleset's required ai-review check MUST be pinned to that App's
# integration_id (the App ID), or a GITHUB_TOKEN-posted check would still satisfy it. The App needs
# Checks, Pull requests and Issues read/write, Contents read. checks: write stays on GITHUB_TOKEN
# below only for the advisory fallback.
#
# SECURITY: pull_request_target runs this workflow and every script it calls from
# the BASE branch, so a PR cannot change its own reviewer. The PR head is checked
# out into pr/ as plain files for the reviewers to read. Nothing from pr/ is ever
# installed, built, tested or executed by this workflow.
# - The jobs that hold the App secrets (review, finalize, override) run in the ai-review environment,
#   whose deployment-branch policy allows only develop and main and which alone holds
#   AI_REVIEW_APP_ID and AI_REVIEW_APP_PRIVATE_KEY. A pushed branch running its own copy of this file
#   cannot read them.
# - Every reviewer checkout pins ref: develop, and workflow_dispatch (replay and override) runs only
#   from develop, so a dispatch on another branch never runs that branch's scripts.
#
# @ai-reviewer mention: a maintainer (OWNER/MEMBER/COLLABORATOR) comment on a PR re-runs the
# review with an optional focus. issue_comment workflows run from the default branch (main),
# so the mention works once this file reaches main. The comment body is passed only through a
# step env var, never interpolated into a run: script.
# - The reviewer for a comment is checked out from develop explicitly, not from the default
#   branch. A comment is also ignored (job succeeds, nothing posted) when the PR's base is not
#   develop, because a stacked PR's base branch is author-controlled.
# - A comment never cancels a running review: each comment gets its own concurrency group.
# - The `if` below only pre-filters on '@ai-review'; the first step then applies the exact mention
#   pattern (the same one as MENTION_RE in scripts/ai-review/pipeline.ts) before any checkout or
#   install, and run.ts applies it again before any model call.
#
# Gate mode (.github/ai-review/gate.json "mode": "gate"): an unfinished or incomplete review is a
# failure, because GitHub counts neutral as passing for a required check. Every check carries its kind
# in external_id (scripts/ai-review/gate.ts). A re-run on the same commit (mention, label, replay) never
# clears an earlier failure; only a run where no review happened (not configured, crashed) gives way.
#
# Maintainer override, the only way to pass an incomplete review: run this workflow by hand
# (workflow_dispatch) with pr, override_sha (the full head SHA) and override_reason. The override job
# checks the actor has the admin or maintain role, that the SHA is the PR head, and that the latest
# result is not a confirmed blocking finding, then posts a passing check for that SHA only, with who,
# when, why and the SHA in the check summary and a PR comment. A tripwire hit or a size-limit result is
# incomplete, so it is overridable this way; a confirmed blocking finding never is.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    # edited: only a base change re-runs (see the job if:), so a PR retargeted to develop gets a check.
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to replay
        required: true
        type: number
      override_sha:
        description: Maintainer override. Full head SHA whose incomplete ai-review result passes. Leave empty to replay.
        required: false
        type: string
        default: ''
      override_reason:
        description: Why the override is safe. Recorded on the check and the PR.
        required: false
        type: string
        default: ''

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}${{ github.event_name == 'issue_comment' && format('-c{0}', github.event.comment.id) || '' }}${{ inputs.override_sha && '-override' || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write # advisory fallback only; a gate result is posted with the App token
  issues: write

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft != true
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && (github.event.action != 'edited' || github.event.changes.base))
      || (github.event_name == 'workflow_dispatch' && inputs.override_sha == '' && github.ref == 'refs/heads/develop')
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && contains(github.event.comment.body, '@ai-review')
          && github.event.comment.user.type != 'Bot'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # ADR-0027: a repository variable moves this job to the self-hosted fleet; unset, it stays GitHub-hosted.
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    environment: ai-review
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.cfg.outputs.mode }}
      sha: ${{ steps.pr.outputs.sha }}
      posted: ${{ steps.review.outputs.posted }}
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_APP: ${{ secrets.AI_REVIEW_APP_ID != '' && secrets.AI_REVIEW_APP_PRIVATE_KEY != '' }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
    steps:
      # Exact mention gate: the `if` above is a substring test, so '@ai-reviewers' passes it. This
      # mirrors MENTION_RE (`@ai-review(er)?` not followed by a word character or '-'); a comment
      # that fails it skips every later step. The body arrives only through this env var.
      - name: Mention gate
        id: gate
        if: github.event_name == 'issue_comment'
        env:
          AI_REVIEW_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if ! printf '%s' "$AI_REVIEW_COMMENT_BODY" | LC_ALL=C grep -Eiq '@ai-review(er)?([^A-Za-z0-9_-]|$)'; then
            echo "no exact @ai-review mention; ignoring the comment"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The dedicated App token for every post; see CHECK IDENTITY above.
      - name: Mint ai-review App token
        id: app
        if: steps.gate.outputs.skip != 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}

      # Checkout 1: the base branch. Scripts, prompts and config come only from here.
      - name: Checkout reviewer (base branch)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: reviewer
          ref: develop
          persist-credentials: false

      - name: Resolve pull request
        id: pr
        if: steps.gate.outputs.skip != 'true'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '"sha=" + .head.sha, "repo=" + .head.repo.full_name, "base=" + .base.ref, "draft=" + (.draft | tostring)' >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "issue_comment" ] && [ "$(grep '^base=' "$GITHUB_OUTPUT" | tail -1)" != "base=develop" ]; then
            echo "base is not develop; ignoring the comment"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          # Automatic runs skip drafts in the job if:, but issue_comment payloads carry no draft flag,
          # so a mention on a draft PR is skipped here using the draft state read from the API above.
          if [ "${{ github.event_name }}" = "issue_comment" ] && [ "$(grep '^draft=' "$GITHUB_OUTPUT" | tail -1)" = "draft=true" ]; then
            echo "PR is a draft; ignoring the comment"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check configuration
        id: cfg
        if: steps.gate.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          # In gate mode the check is required, and GitHub counts neutral as passing.
          MODE=$(jq -r .mode reviewer/.github/ai-review/gate.json)
          # Same rule as readGateMode: an unknown mode is a broken config, so fail without posting.
          case "$MODE" in
            advisory|gate) ;;
            *) echo "::error::gate.json mode must be advisory or gate, got '$MODE'"; exit 1 ;;
          esac
          if [ "$MODE" = gate ] && [ "$APP_TOKEN" != true ]; then
            echo "::warning::gate.json says gate, but the ai-review App secrets are not set: staying advisory, no gate result is posted with GITHUB_TOKEN"
            MODE=advisory
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          UNFINISHED=neutral; [ "$MODE" = gate ] && UNFINISHED=failure
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            # Gate mode: "unconfigured" is only a placeholder, so like the finalizer it is posted only when
            # no ai-review result from the App is on the commit yet. It never revokes an override or a result.
            if [ "$MODE" = gate ]; then
              EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=ai-review&filter=all&per_page=100" \
                --jq '[.check_runs[] | select(.status == "completed" and .app.slug == env.APP_SLUG)] | length')
              if [ "$EXISTING" != 0 ]; then
                echo "an ai-review result is already on $HEAD_SHA; not posting the unconfigured placeholder"
                exit 0
              fi
            fi
            gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name=ai-review -f head_sha="$HEAD_SHA" -f status=completed -f conclusion="$UNFINISHED" \
              -f external_id="ai-review:unconfigured:${GITHUB_RUN_ID}" \
              -f 'output[title]=AI review not configured' \
              -f 'output[summary]=Neither the CLAUDE_CODE_OAUTH_TOKEN nor the ANTHROPIC_API_KEY secret is set, so no review ran.'
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Checkout 2: the PR head, read-only files for the reviewers. No credentials kept.
      - name: Checkout PR head (read-only)
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      # A symlink in the PR could point a reviewer's Read outside pr/ (for example at /proc/<pid>/environ).
      - name: Remove symlinks from the PR checkout
        if: steps.cfg.outputs.ok == 'true'
        run: find pr -type l -delete

      - name: Setup Node.js
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        if: steps.cfg.outputs.ok == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.285

      - name: Run AI review
        id: review
        if: steps.cfg.outputs.ok == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          AI_REVIEW_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          AI_REVIEW_COMMENT_ID: ${{ github.event.comment.id }}
          AI_REVIEW_COMMENT_BODY: ${{ github.event.comment.body }}
        run: >
          npx --yes tsx@4.23.15 reviewer/scripts/ai-review/run.ts
          --pr "$PR_NUMBER" --repo "${{ github.repository }}"
          --head-dir pr --config-dir reviewer/.github/ai-review
          --head-sha "${{ steps.pr.outputs.sha }}"

      - name: Upload result
        if: always() && steps.cfg.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ env.PR_NUMBER }}-${{ steps.pr.outputs.sha }}
          path: ai-review-result.json
          if-no-files-found: ignore
          retention-days: 90

  # Timeout and crash finalizer, as its own job so it runs even when the review job times out, including
  # before that job read its config. It reads the mode itself from the trusted base checkout (same rule
  # as the review job: an unknown mode fails, gate without the App secrets is advisory), and in gate
  # mode posts a failure only when no ai-review result from the App is on the commit, the commit is
  # still the head and the PR targets develop. It never relies on the review job's outputs to decide.
  finalize:
    needs: review
    if: always() && needs.review.result != 'success' && needs.review.result != 'skipped'
    # ADR-0027: a repository variable moves this job to the self-hosted fleet; unset, it stays GitHub-hosted.
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    environment: ai-review
    timeout-minutes: 10
    env:
      HAS_APP: ${{ secrets.AI_REVIEW_APP_ID != '' && secrets.AI_REVIEW_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint ai-review App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}

      - name: Checkout reviewer (base branch)
        uses: actions/checkout@v4
        with:
          path: reviewer
          ref: develop
          persist-credentials: false

      - name: Read gate mode
        id: mode
        env:
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
        run: |
          MODE=$(jq -r .mode reviewer/.github/ai-review/gate.json)
          case "$MODE" in
            advisory|gate) ;;
            *) echo "::error::gate.json mode must be advisory or gate, got '$MODE'"; exit 1 ;;
          esac
          if [ "$MODE" = gate ] && [ "$APP_TOKEN" != true ]; then
            echo "::warning::gate.json says gate, but the ai-review App secrets are not set: staying advisory"
            MODE=advisory
          fi
          echo "finalizer mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.mode.outputs.mode == 'gate'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The SHA is a hint; when the review job died before resolving it, the finalizer uses the PR head.
      - name: Post a failure for an unfinished review
        if: steps.mode.outputs.mode == 'gate'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AI_REVIEW_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          FINAL_PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          FINAL_SHA: ${{ needs.review.outputs.sha }}
        run: >
          npx --yes tsx@4.23.15 reviewer/scripts/ai-review/gate-run.ts finalize
          --repo "$GITHUB_REPOSITORY" --pr "$FINAL_PR" --sha "$FINAL_SHA"

  override:
    if: github.event_name == 'workflow_dispatch' && inputs.override_sha != '' && github.ref == 'refs/heads/develop'
    # ADR-0027: a repository variable moves this job to the self-hosted fleet; unset, it stays GitHub-hosted.
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    environment: ai-review
    timeout-minutes: 10
    env:
      HAS_APP: ${{ secrets.AI_REVIEW_APP_ID != '' && secrets.AI_REVIEW_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint ai-review App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}

      - name: Checkout reviewer (base branch)
        uses: actions/checkout@v4
        with:
          path: reviewer
          ref: develop
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # An override posts a passing check, so it is posted with the App token or not at all.
      - name: Require the ai-review App
        if: steps.app.outputs.token == ''
        run: |
          echo "::error::The ai-review App secrets (AI_REVIEW_APP_ID, AI_REVIEW_APP_PRIVATE_KEY) are not set; an override is never posted with GITHUB_TOKEN. Nothing was posted."
          exit 1

      # Inputs reach the script only through env, never interpolated into the shell.
      - name: Apply the maintainer override
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AI_REVIEW_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          AI_REVIEW_ACTOR: ${{ github.triggering_actor }}
          AI_REVIEW_OVERRIDE_REASON: ${{ inputs.override_reason }}
          OVERRIDE_PR: ${{ inputs.pr }}
          OVERRIDE_SHA: ${{ inputs.override_sha }}
        run: >
          npx --yes tsx@4.23.15 reviewer/scripts/ai-review/gate-run.ts override
          --repo "$GITHUB_REPOSITORY" --pr "$OVERRIDE_PR" --sha "$OVERRIDE_SHA"
